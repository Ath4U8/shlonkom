name: Simple Build
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - run: flutter create . --platforms=android --org dev.shlonkom --project-name shlonkom --overwrite
      - run: |
          cp android/app/google-services.json /tmp/g.json || true
          flutter create . --platforms=android --org dev.shlonkom --project-name shlonkom --overwrite
          mkdir -p android/app
          cp /tmp/g.json android/app/google-services.json || true
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: shlonkom-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
