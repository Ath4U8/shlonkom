name: Simple Build
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Build Shlonkom With Real Email Check
        run: |
          if [ -f android/app/google-services.json ]; then cp android/app/google-services.json /tmp/g.json; fi
          flutter create . --platforms=android --org dev.shlonkom --project-name shlonkom --overwrite
          mkdir -p android/app
          if [ -f /tmp/g.json ]; then cp /tmp/g.json android/app/google-services.json; fi
          python3 << 'PY'
          import pathlib
          p=pathlib.Path('android/build.gradle')
          t=p.read_text()
          if 'google-services' not in t:
            t=t.replace('dependencies {','dependencies {\n        classpath "com.google.gms:google-services:4.4.0"')
            p.write_text(t)
          p=pathlib.Path('android/app/build.gradle')
          t=p.read_text()
          if 'com.google.gms.google-services' not in t:
            t=t.replace("apply plugin: 'com.android.application'","apply plugin: 'com.android.application'\napply plugin: 'com.google.gms.google-services'")
            p.write_text(t)
          t=p.read_text().replace('minSdkVersion 19','minSdkVersion 21').replace('flutter.minSdkVersion','21')
          p.write_text(t)
          PY
          python3 << 'PY'
          import json, pathlib
          j=json.loads(pathlib.Path('android/app/google-services.json').read_text())
          c=j['client'][0]
          k=c['api_key'][0]['current_key']
          aid=c['client_info']['mobilesdk_app_id']
          pid=j['project_info']['project_id']
          num=j['project_info']['project_number']
          buck=j['project_info']['storage_bucket']
          pathlib.Path('lib/firebase_options.dart').write_text(f"import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;\nclass DefaultFirebaseOptions {{\n static FirebaseOptions get currentPlatform => android;\n static const FirebaseOptions android = FirebaseOptions(apiKey: '{k}', appId: '{aid}', messagingSenderId: '{num}', projectId: '{pid}', storageBucket: '{buck}',);\n}}\n")
          pathlib.Path('pubspec.yaml').write_text("name: shlonkom\npublish_to: none\nversion: 1.0.0+1\nenvironment:\n sdk: '>=3.0.0 <4.0.0'\ndependencies:\n flutter:\n  sdk: flutter\n cupertino_icons: ^1.0.2\n firebase_core: ^2.32.0\n firebase_auth: ^4.20.0\n cloud_firestore: ^4.17.5\nflutter:\n uses-material-design: true\n")
          PY
          cat > lib/main.dart << 'DART'
          import 'dart:math';
          import 'package:flutter/material.dart';
          import 'package:firebase_core/firebase_core.dart';
          import 'package:firebase_auth/firebase_auth.dart';
          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'firebase_options.dart';
          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await Firebase.initializeApp(options: DefaultFirebaseOptions.currentPlatform);
            runApp(const MyApp());
          }
          class MyApp extends StatelessWidget {
            const MyApp({super.key});
            @override
            Widget build(BuildContext context) {
              return const MaterialApp(debugShowCheckedModeBanner: false, home: AuthGate());
            }
          }
          class AuthGate extends StatelessWidget {
            const AuthGate({super.key});
            @override
            Widget build(BuildContext context) {
              return StreamBuilder<User?>(
                stream: FirebaseAuth.instance.userChanges(),
                builder: (context, snap) {
                  if (snap.connectionState == ConnectionState.waiting) return const Scaffold(body: Center(child: CircularProgressIndicator()));
                  if (snap.hasData) {
                    if (snap.data!.emailVerified == false) {
                      return const VerifyEmailScreen();
                    }
                    return const MainScreen();
                  }
                  return const Login();
                },
              );
            }
          }
          bool isValidEmail(String email) {
            return RegExp(r'^[\w-\.]+@([\w-]+\.)+[\w-]{2,4}$').hasMatch(email);
          }
          class Login extends StatefulWidget { const Login({super.key}); @override State<Login> createState() => _Login(); }
          class _Login extends State<Login> {
            final e=TextEditingController(); final p=TextEditingController(); final n=TextEditingController(); bool isLogin=true; bool load=false;
            Future<void> go() async {
              String email = e.text.trim();
              String pass = p.text.trim();
              String name = n.text.trim();
              if(email.isEmpty||pass.isEmpty){ ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content:Text('املا كل الحقول'))); return; }
              if(!isValidEmail(email)){ ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content:Text('اكتب ايميل حقيقي مثل name@gmail.com - لازم بيه @ و .com'))); return; }
              if(pass.length<6){ ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content:Text('كلمة السر لازم 6 احرف على الأقل'))); return; }
              if(!isLogin && name.isEmpty){ ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content:Text('اكتب اسمك'))); return; }
              setState(()=>load=true);
              try{
                if(isLogin){
                  await FirebaseAuth.instance.signInWithEmailAndPassword(email:email,password:pass);
                } else {
                  var cr=await FirebaseAuth.instance.createUserWithEmailAndPassword(email:email,password:pass);
                  var code=name.toLowerCase().replaceAll(' ','')+"_"+Random().nextInt(999999).toString().padLeft(6,'0');
                  await FirebaseFirestore.instance.collection('users').doc(cr.user!.uid).set({'uid':cr.user!.uid,'name':name,'email':email,'username':code});
                  await cr.user!.sendEmailVerification();
                }
              } catch(ex){
                String msg=ex.toString();
                if(msg.contains('invalid-email')) msg='ايميل غير صحيح';
                if(msg.contains('email-already-in-use')) msg='الايميل مستخدم من قبل';
                if(msg.contains('weak-password')) msg='كلمة السر ضعيفة';
                ScaffoldMessenger.of(context).showSnackBar(SnackBar(content:Text(msg)));
              }
              setState(()=>load=false);
            }
            @override Widget build(BuildContext context){ return Scaffold(body:Padding(padding:const EdgeInsets.all(20),child:Column(children:[const SizedBox(height:60),Container(width:70,height:45,decoration:BoxDecoration(borderRadius:BorderRadius.circular(6),border:Border.all(color:Colors.black)),child:Column(children:[Expanded(child:Container(color:const Color(0xFFCE1126))),Expanded(child:Container(color:Colors.white,child:const Center(child:Text('الله اكبر',style:TextStyle(fontSize:7,color:Color(0xFF007A3D),fontWeight:FontWeight.bold))))),Expanded(child:Container(color:Colors.black))])),const Text('Shlonkom - شلونكم',style:TextStyle(fontSize:26,fontWeight:FontWeight.bold)),const Text('ايميل حقيقي فقط - Firebase',style:TextStyle(color:Colors.green,fontSize:12)),const SizedBox(height:20),if(!isLogin) TextField(controller:n,decoration:InputDecoration(labelText:'اسمك الحقيقي',border:OutlineInputBorder(borderRadius:BorderRadius.circular(12)))),if(!isLogin) const SizedBox(height:10),TextField(controller:e,keyboardType:TextInputType.emailAddress,decoration:InputDecoration(labelText:'ايميل حقيقي مثل name@gmail.com',prefixIcon:const Icon(Icons.email),border:OutlineInputBorder(borderRadius:BorderRadius.circular(12)))),const SizedBox(height:10),TextField(controller:p,obscureText:true,decoration:InputDecoration(labelText:'باسوورد 6 احرف على الأقل',border:OutlineInputBorder(borderRadius:BorderRadius.circular(12)))),const SizedBox(height:20),SizedBox(width:double.infinity,child:ElevatedButton(onPressed:load?null:go,style:ElevatedButton.styleFrom(backgroundColor:const Color(0xFF00C950)),child:Text(load?'...':isLogin?'دخول':'انشاء حساب + تحقق ايميل',style:const TextStyle(color:Colors.white)))),TextButton(onPressed:()=>setState(()=>isLogin=!isLogin),child:Text(isLogin?'انشاء حساب جديد':'عندك حساب؟ دخول')),const Text('Created by: Atheer Sami - Basra',style:TextStyle(fontSize:11))]))) ;}
          }
          class VerifyEmailScreen extends StatefulWidget { const VerifyEmailScreen({super.key}); @override State<VerifyEmailScreen> createState()=>_Verify(); }
          class _Verify extends State<VerifyEmailScreen>{
            bool loading=false;
            Future<void> check() async {
              await FirebaseAuth.instance.currentUser!.reload();
              var user=FirebaseAuth.instance.currentUser;
              if(user!=null && user.emailVerified){ ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content:Text('تم التحقق!'))); }
            }
            @override Widget build(BuildContext context){
              var email=FirebaseAuth.instance.currentUser!.email??'';
              return Scaffold(body:Padding(padding:const EdgeInsets.all(20),child:Column(mainAxisAlignment:MainAxisAlignment.center,children:[const Icon(Icons.email,size:80,color:Color(0xFF00C950)),const SizedBox(height:20),const Text('تحقق من ايميلك',style:TextStyle(fontSize:22,fontWeight:FontWeight.bold)),const SizedBox(height:10),Text('دزينا رابط تحقق على:\n$email',textAlign:TextAlign.center),const SizedBox(height:20),const Text('افتح ايميلك واضغط على رابط التحقق\nبعدها اضغط الزر تحت',textAlign:TextAlign.center,style:TextStyle(color:Colors.grey)),const SizedBox(height:20),SizedBox(width:double.infinity,child:ElevatedButton(onPressed:() async { setState(()=>loading=true); await check(); setState(()=>loading=false); },child:Text(loading?'...':'تحققت - اضغط هنا'))),TextButton(onPressed:()=>FirebaseAuth.instance.currentUser!.sendEmailVerification(),child:const Text('اعادة ارسال الرابط')),TextButton(onPressed:()=>FirebaseAuth.instance.signOut(),child:const Text('خروج'))])));
            }
          }
          class MainScreen extends StatefulWidget { const MainScreen({super.key}); @override State<MainScreen> createState()=>_Main(); }
          class _Main extends State<MainScreen>{ int tab=0; @override Widget build(BuildContext context){ return Scaffold(body:tab==0?const ChatsTab():const AddTab(),bottomNavigationBar:BottomNavigationBar(currentIndex:tab,onTap:(i)=>setState(()=>tab=i),selectedItemColor:const Color(0xFF00C950),items:const [BottomNavigationBarItem(icon:Icon(Icons.chat),label:'الدردشات'),BottomNavigationBarItem(icon:Icon(Icons.person_add),label:'اضافة بالكود')])); } }
          class ChatsTab extends StatelessWidget {
            const ChatsTab({super.key});
            @override Widget build(BuildContext context){
              var uid=FirebaseAuth.instance.currentUser!.uid;
              return Scaffold(appBar:AppBar(title:const Text('شلونكم 🇮🇶'),backgroundColor:const Color(0xFF00C950),foregroundColor:Colors.white,actions:[IconButton(icon:const Icon(Icons.logout),onPressed:()=>FirebaseAuth.instance.signOut())]),body:Column(children:[StreamBuilder<DocumentSnapshot>(stream:FirebaseFirestore.instance.collection('users').doc(uid).snapshots(),builder:(context,snap){ if(!snap.hasData) return const SizedBox(); var d=snap.data!.data() as Map<String,dynamic>?; if(d==null) return const SizedBox(); return Container(width:double.infinity,padding:const EdgeInsets.all(12),color:Colors.green.withOpacity(0.1),child:Text('كودك: @${d['username']}',style:const TextStyle(fontWeight:FontWeight.bold))); }),Expanded(child:StreamBuilder<QuerySnapshot>(stream:FirebaseFirestore.instance.collection('users').doc(uid).collection('friends').snapshots(),builder:(context,s){ if(!s.hasData) return const Center(child:CircularProgressIndicator()); if(s.data!.docs.isEmpty) return const Center(child:Text('ما عندك اصدقاء\nاضف صديق بالكود',textAlign:TextAlign.center)); return ListView(children:s.data!.docs.map((doc){ var d=doc.data() as Map<String,dynamic>; return Card(child:ListTile(leading:CircleAvatar(backgroundColor:const Color(0xFF00C950),child:Text(d['name'][0],style:const TextStyle(color:Colors.white))),title:Text(d['name']),subtitle:Text('@${d['username']}'),trailing:const Icon(Icons.chat,color:Color(0xFF00C950)),onTap:()=>Navigator.push(context,MaterialPageRoute(builder:(_)=>ChatPage(friendId:doc.id,friendName:d['name']))))); }).toList()); })) ]));
            }
          }
          class AddTab extends StatefulWidget { const AddTab({super.key}); @override State<AddTab> createState()=>_Add(); }
          class _Add extends State<AddTab>{
            final ctrl=TextEditingController(); List<DocumentSnapshot> res=[]; bool load=false;
            Future<void> search() async {
              String code=ctrl.text.trim().replaceAll('@','').toLowerCase();
              if(code.isEmpty){ ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content:Text('اكتب كود'))); return; }
              setState(()=>load=true);
              var q=await FirebaseFirestore.instance.collection('users').where('username',isEqualTo:code).get();
              setState((){ res=q.docs; load=false; });
              if(q.docs.isEmpty){ ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content:Text('ما لقينا هذا الكود - تأكد منه'))); }
            }
            Future<void> add(DocumentSnapshot doc) async { var myUid=FirebaseAuth.instance.currentUser!.uid; var f=doc.data() as Map<String,dynamic>; if(f['uid']==myUid){ ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content:Text('ما تكدر تضيف نفسك'))); return; } var myDoc=await FirebaseFirestore.instance.collection('users').doc(myUid).get(); var myData=myDoc.data()!; await FirebaseFirestore.instance.collection('users').doc(myUid).collection('friends').doc(f['uid']).set({'uid':f['uid'],'name':f['name'],'username':f['username']}); await FirebaseFirestore.instance.collection('users').doc(f['uid']).collection('friends').doc(myUid).set({'uid':myUid,'name':myData['name'],'username':myData['username']}); ScaffoldMessenger.of(context).showSnackBar(SnackBar(content:Text('تمت اضافة ${f['name']}'))); }
            @override Widget build(BuildContext context){ return Scaffold(appBar:AppBar(title:const Text('اضافة بالكود'),backgroundColor:const Color(0xFF00C950),foregroundColor:Colors.white),body:Padding(padding:const EdgeInsets.all(16),child:Column(children:[Row(children:[Expanded(child:TextField(controller:ctrl,decoration:InputDecoration(hintText:'كود صديقك الحقيقي',prefixText:'@',border:OutlineInputBorder(borderRadius:BorderRadius.circular(12))))),const SizedBox(width:8),ElevatedButton(onPressed:search,child:const Text('بحث'))]),const SizedBox(height:20),if(load) const CircularProgressIndicator(),...res.map((doc){ var d=doc.data() as Map<String,dynamic>; return Card(child:ListTile(title:Text(d['name']),subtitle:Text('@${d["username"]}'),trailing:ElevatedButton(onPressed:()=>add(doc),child:const Text('اضافة')))); })]))); }
          }
          class ChatPage extends StatefulWidget { final String friendId,friendName; const ChatPage({super.key,required this.friendId,required this.friendName}); @override State<ChatPage> createState()=>_Chat(); }
          class _Chat extends State<ChatPage>{
            final ctrl=TextEditingController(); final stickers=['😂','😍','🔥','💚','🇮🇶','😎','🙏','💪','❤️','☕','⚽','🌸'];
            String get chatId { var ids=[FirebaseAuth.instance.currentUser!.uid,widget.friendId]..sort(); return ids.join('_'); }
            void send([String? t]){ var text=t??ctrl.text.trim(); if(text.isEmpty) return; FirebaseFirestore.instance.collection('chats').doc(chatId).collection('messages').add({'text':text,'sender':FirebaseAuth.instance.currentUser!.uid,'time':FieldValue.serverTimestamp()}); ctrl.clear(); }
            @override Widget build(BuildContext context){ return Scaffold(appBar:AppBar(title:Text(widget.friendName),backgroundColor:const Color(0xFF00C950),foregroundColor:Colors.white),body:Column(children:[Expanded(child:StreamBuilder<QuerySnapshot>(stream:FirebaseFirestore.instance.collection('chats').doc(chatId).collection('messages').orderBy('time').snapshots(),builder:(context,s){ if(!s.hasData) return const Center(child:CircularProgressIndicator()); return ListView.builder(padding:const EdgeInsets.all(10),itemCount:s.data!.docs.length,itemBuilder:(context,i){ var d=s.data!.docs[i].data() as Map<String,dynamic>; bool isMe=d['sender']==FirebaseAuth.instance.currentUser!.uid; return Align(alignment:isMe?Alignment.centerRight:Alignment.centerLeft,child:Container(margin:const EdgeInsets.symmetric(vertical:3),padding:const EdgeInsets.all(10),decoration:BoxDecoration(color:isMe?const Color(0xFF00C950):Colors.grey[200],borderRadius:BorderRadius.circular(12)),child:Text(d['text'],style:TextStyle(color:isMe?Colors.white:Colors.black)))); }); })),Container(height:46,child:ListView.builder(scrollDirection:Axis.horizontal,itemCount:stickers.length,itemBuilder:(c,i)=>InkWell(onTap:()=>send(stickers[i]),child:Container(margin:const EdgeInsets.all(4),padding:const EdgeInsets.symmetric(horizontal:8,vertical:6),decoration:BoxDecoration(color:Colors.grey[100],borderRadius:BorderRadius.circular(12)),child:Text(stickers[i],style:const TextStyle(fontSize:20)))))),Padding(padding:const EdgeInsets.all(8),child:Row(children:[Expanded(child:TextField(controller:ctrl,decoration:InputDecoration(hintText:'اكتب...',filled:true,fillColor:Colors.grey[100],border:OutlineInputBorder(borderRadius:BorderRadius.circular(20),borderSide:BorderSide.none)))),const SizedBox(width:6),CircleAvatar(backgroundColor:const Color(0xFF00C950),child:IconButton(icon:const Icon(Icons.send,color:Colors.white),onPressed:()=>send()))]))])); }
          }
          DART
          flutter pub get
          flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: shlonkom-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
