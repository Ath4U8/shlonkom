name: Build Shlonkom APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Build APK Keep Code
        run: |
          cp lib/main.dart /tmp/my_main.dart 2>/dev/null || true
          if [ ! -f "android/app/build.gradle" ]; then
            flutter create . --platforms=android --org dev.shlonkom --project-name shlonkom --overwrite
          fi
          cp /tmp/my_main.dart lib/main.dart 2>/dev/null || true
          sed -i "s/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/" android/app/build.gradle || true
          python3 << 'PY'
          import json
          with open('android/app/google-services.json') as f:
              data=json.load(f)
              client=data['client'][0]
              info=client['client_info']
              api=client['api_key'][0]['current_key']
              proj=data['project_info']
              app_id=info['mobilesdk_app_id']
              proj_num=proj['project_number']
              proj_id=proj['project_id']
              bucket=proj['storage_bucket']
              code=f'''import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          import 'package:flutter/foundation.dart' show defaultTargetPlatform, TargetPlatform, kIsWeb;
          class DefaultFirebaseOptions {{
            static FirebaseOptions get currentPlatform {{
              if (kIsWeb) throw UnsupportedError('web not supported');
              switch (defaultTargetPlatform) {{
                case TargetPlatform.android:
                  return android;
                default:
                  throw UnsupportedError('not android');
              }}
            }}
            static const FirebaseOptions android = FirebaseOptions(
              apiKey: '{api}',
              appId: '{app_id}',
              messagingSenderId: '{proj_num}',
              projectId: '{proj_id}',
              storageBucket: '{bucket}',
            );
          }}
          '''
              open('lib/firebase_options.dart','w').write(code)
              print("firebase_options.dart OK")
          PY
          flutter pub get
          flutter build apk --debug
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: shlonkom-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
