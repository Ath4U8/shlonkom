name: Simple Build
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Build Shlonkom Firebase Real
        run: |
          # حفظ google-services.json
          if [ -f android/app/google-services.json ]; then cp android/app/google-services.json /tmp/g.json; echo "saved g.json"; fi
          
          flutter create . --platforms=android --org dev.shlonkom --project-name shlonkom --overwrite
          
          mkdir -p android/app
          if [ -f /tmp/g.json ]; then cp /tmp/g.json android/app/google-services.json; echo "restored g.json"; fi
          ls -lh android/app/google-services.json
          
          python3 << 'PY'
          import pathlib
          p=pathlib.Path('android/build.gradle')
          t=p.read_text()
          if 'google-services' not in t:
            t=t.replace('dependencies {','dependencies {\n        classpath "com.google.gms:google-services:4.4.0"')
            p.write_text(t)
          print("Fixed android/build.gradle")
          p=pathlib.Path('android/app/build.gradle')
          t=p.read_text()
          if 'com.google.gms.google-services' not in t:
            t=t.replace("apply plugin: 'com.android.application'","apply plugin: 'com.android.application'\napply plugin: 'com.google.gms.google-services'")
            p.write_text(t)
          print("Fixed app/build.gradle")
          t=p.read_text().replace('minSdkVersion 19','minSdkVersion 21').replace('flutter.minSdkVersion','21').replace('minSdk 19','minSdk 21')
          p.write_text(t)
          PY

          python3 << 'PY'
          import json, pathlib
          j=json.loads(pathlib.Path('android/app/google-services.json').read_text())
          c=j['client'][0]
          k=c['api_key'][0]['current_key']
          aid=c['client_info']['mobilesdk_app_id']
          pid=j['project_info']['project_id']
          num=j['project_info']['project_number']
          buck=j['project_info']['storage_bucket']
          pathlib.Path('lib/firebase_options.dart').write_text(f"import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;\nclass DefaultFirebaseOptions {{\n static FirebaseOptions get currentPlatform => android;\n static const FirebaseOptions android = FirebaseOptions(apiKey: '{k}', appId: '{aid}', messagingSenderId: '{num}', projectId: '{pid}', storageBucket: '{buck}',);\n}}\n")
          pathlib.Path('pubspec.yaml').write_text("name: shlonkom\npublish_to: none\nversion: 1.0.0+1\nenvironment:\n sdk: '>=3.0.0 <4.0.0'\ndependencies:\n flutter:\n  sdk: flutter\n cupertino_icons: ^1.0.2\n firebase_core: ^2.24.0\n firebase_auth: ^4.15.0\n cloud_firestore: ^4.14.0\nflutter:\n uses-material-design: true\n")
          PY

          cat > lib/main.dart << 'DART'
          import 'package:flutter/material.dart';
          import 'package:firebase_core/firebase_core.dart';
          import 'package:firebase_auth/firebase_auth.dart';
          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'firebase_options.dart';
          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await Firebase.initializeApp(options: DefaultFirebaseOptions.currentPlatform);
            runApp(const MyApp());
          }
          class MyApp extends StatelessWidget {
            const MyApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(debugShowCheckedModeBanner: false, home: StreamBuilder<User?>(stream: FirebaseAuth.instance.authStateChanges(), builder: (context, snap) { if (snap.connectionState == ConnectionState.waiting) return const Scaffold(body: Center(child: CircularProgressIndicator())); return snap.hasData ? const Home() : const Login(); }));
            }
          }
          class Login extends StatefulWidget { const Login({super.key}); @override State<Login> createState() => _Login(); }
          class _Login extends State<Login> {
            final e=TextEditingController(); final p=TextEditingController(); final n=TextEditingController(); bool isLogin=true; bool load=false;
            Future<void> go() async {
              if(e.text.isEmpty||p.text.isEmpty) return;
              setState(()=>load=true);
              try{
                if(isLogin){ await FirebaseAuth.instance.signInWithEmailAndPassword(email:e.text.trim(),password:p.text.trim()); }
                else{
                  var cr=await FirebaseAuth.instance.createUserWithEmailAndPassword(email:e.text.trim(),password:p.text.trim());
                  var code=n.text.trim().toLowerCase().replaceAll(' ','')+"_"+DateTime.now().millisecondsSinceEpoch.toString().substring(9);
                  await FirebaseFirestore.instance.collection('users').doc(cr.user!.uid).set({'uid':cr.user!.uid,'name':n.text.trim(),'email':e.text.trim(),'username':code});
                }
              }catch(ex){ ScaffoldMessenger.of(context).showSnackBar(SnackBar(content:Text(ex.toString()))); }
              setState(()=>load=false);
            }
            @override Widget build(BuildContext context){ return Scaffold(body:Padding(padding:const EdgeInsets.all(20),child:Column(children:[const SizedBox(height:60),const Text('Shlonkom - شلونكم',style:TextStyle(fontSize:26,fontWeight:FontWeight.bold)),const Text('Firebase حقيقي',style:TextStyle(color:Colors.green)),const SizedBox(height:20),if(!isLogin) TextField(controller:n,decoration:InputDecoration(labelText:'اسمك',border:OutlineInputBorder(borderRadius:BorderRadius.circular(12)))),if(!isLogin) const SizedBox(height:10),TextField(controller:e,decoration:InputDecoration(labelText:'ايميل',border:OutlineInputBorder(borderRadius:BorderRadius.circular(12)))),const SizedBox(height:10),TextField(controller:p,obscureText:true,decoration:InputDecoration(labelText:'باسوورد',border:OutlineInputBorder(borderRadius:BorderRadius.circular(12)))),const SizedBox(height:20),SizedBox(width:double.infinity,child:ElevatedButton(onPressed:load?null:go,style:ElevatedButton.styleFrom(backgroundColor:const Color(0xFF00C950)),child:Text(load?'...':isLogin?'دخول':'انشاء حساب',style:const TextStyle(color:Colors.white)))),TextButton(onPressed:()=>setState(()=>isLogin=!isLogin),child:Text(isLogin?'انشاء حساب':'دخول')),const Text('Created by Atheer Sami - Basra',style:TextStyle(fontSize:11))]))) ;}
          }
          class Home extends StatelessWidget {
            const Home({super.key});
            @override Widget build(BuildContext context){
              var uid=FirebaseAuth.instance.currentUser!.uid;
              return Scaffold(appBar:AppBar(title:const Text('شلونكم'),backgroundColor:const Color(0xFF00C950),foregroundColor:Colors.white,actions:[IconButton(icon:const Icon(Icons.logout),onPressed:()=>FirebaseAuth.instance.signOut())]),body:Column(children:[StreamBuilder<DocumentSnapshot>(stream:FirebaseFirestore.instance.collection('users').doc(uid).snapshots(),builder:(context,snap){ if(!snap.hasData) return const SizedBox(); var d=snap.data!.data() as Map<String,dynamic>?; if(d==null) return const SizedBox(); return Container(width:double.infinity,padding:const EdgeInsets.all(12),color:Colors.green.withOpacity(0.1),child:Text('كودك: @${d['username']}',style:const TextStyle(fontWeight:FontWeight.bold))); }),const Expanded(child:Center(child:Text('تم تسجيل الدخول ب Firebase الحقيقي!\nبعد ما ينجح نضيف الدردشة',textAlign:TextAlign.center))) ]));
            }
          }
          DART

          flutter pub get
          flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: shlonkom-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
