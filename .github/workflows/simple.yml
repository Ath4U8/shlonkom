name: Simple Build
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Build Shlonkom V4 Calls
        run: |
          if [ -f android/app/google-services.json ]; then cp android/app/google-services.json /tmp/g.json; fi
          flutter create . --platforms=android --org dev.shlonkom --project-name shlonkom --overwrite
          mkdir -p android/app
          if [ -f /tmp/g.json ]; then cp /tmp/g.json android/app/google-services.json; fi
          python3 << 'PY'
          import pathlib
          p=pathlib.Path('android/build.gradle')
          t=p.read_text()
          if 'google-services' not in t:
            t=t.replace('dependencies {','dependencies {\n        classpath "com.google.gms:google-services:4.4.0"')
            p.write_text(t)
          p=pathlib.Path('android/app/build.gradle')
          t=p.read_text()
          if 'com.google.gms.google-services' not in t:
            t=t.replace("apply plugin: 'com.android.application'","apply plugin: 'com.android.application'\napply plugin: 'com.google.gms.google-services'")
            p.write_text(t)
          t=p.read_text().replace('minSdkVersion 19','minSdkVersion 21').replace('flutter.minSdkVersion','21')
          p.write_text(t)
          PY
          python3 << 'PY'
          import json, pathlib
          data = json.loads(pathlib.Path('android/app/google-services.json').read_text())
          client = data['client'][0]
          api_key = client['api_key'][0]['current_key']
          app_id = client['client_info']['mobilesdk_app_id']
          project_id = data['project_info']['project_id']
          project_number = data['project_info']['project_number']
          bucket = data['project_info']['storage_bucket']
          content = "import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;\nclass DefaultFirebaseOptions {\n static FirebaseOptions get currentPlatform => android;\n static const FirebaseOptions android = FirebaseOptions(apiKey: '%s', appId: '%s', messagingSenderId: '%s', projectId: '%s', storageBucket: '%s',);\n}\n" % (api_key, app_id, project_number, project_id, bucket)
          pathlib.Path('lib/firebase_options.dart').write_text(content)
          pathlib.Path('pubspec.yaml').write_text("name: shlonkom\npublish_to: none\nversion: 1.0.0+5\nenvironment:\n sdk: '>=3.0.0 <4.0.0'\ndependencies:\n flutter:\n  sdk: flutter\n cupertino_icons: ^1.0.2\n firebase_core: ^2.32.0\n firebase_auth: ^4.20.0\n cloud_firestore: ^4.17.5\nflutter:\n uses-material-design: true\n")
          print("fixed no syntax error")
          PY
          flutter pub get
          flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: shlonkom-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
