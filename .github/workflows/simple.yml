name: Simple Build
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Build Shlonkom Real Firebase
        run: |
          cp android/app/google-services.json /tmp/g.json
          flutter create . --platforms=android --org dev.shlonkom --project-name shlonkom --overwrite
          mkdir -p android/app
          cp /tmp/g.json android/app/google-services.json
          
          python3 << 'PY'
          import pathlib
          p=pathlib.Path('android/build.gradle')
          t=p.read_text()
          if 'google-services' not in t:
            t=t.replace('dependencies {','dependencies {\n        classpath "com.google.gms:google-services:4.4.0"')
            p.write_text(t)
          p=pathlib.Path('android/app/build.gradle')
          t=p.read_text()
          if 'com.google.gms.google-services' not in t:
            t=t.replace("apply plugin: 'com.android.application'","apply plugin: 'com.android.application'\napply plugin: 'com.google.gms.google-services'")
            p.write_text(t)
          t=p.read_text().replace('minSdkVersion 19','minSdkVersion 21').replace('flutter.minSdkVersion','21')
          p.write_text(t)
          print("Gradle fixed")
          PY

          python3 << 'PY'
          import json, pathlib
          j=json.loads(pathlib.Path('android/app/google-services.json').read_text())
          c=j['client'][0]
          key=c['api_key'][0]['current_key']
          app_id=c['client_info']['mobilesdk_app_id']
          proj=j['project_info']['project_id']
          num=j['project_info']['project_number']
          bucket=j['project_info']['storage_bucket']
          pathlib.Path('lib/firebase_options.dart').write_text(f"import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;\nclass DefaultFirebaseOptions {{\n static FirebaseOptions get currentPlatform => android;\n static const FirebaseOptions android = FirebaseOptions(apiKey: '{key}', appId: '{app_id}', messagingSenderId: '{num}', projectId: '{proj}', storageBucket: '{bucket}',);\n}}\n")
          pathlib.Path('pubspec.yaml').write_text("name: shlonkom\npublish_to: none\nversion: 1.0.0+1\nenvironment:\n sdk: '>=3.0.0 <4.0.0'\ndependencies:\n flutter:\n  sdk: flutter\n cupertino_icons: ^1.0.2\n firebase_core: ^2.24.0\n firebase_auth: ^4.15.0\n cloud_firestore: ^4.14.0\nflutter:\n uses-material-design: true\n")
          print("pubspec fixed")
          PY

          # Write main.dart using cat - safe method
          cat > lib/main.dart << 'DART'
          import 'package:flutter/material.dart';
          import 'package:firebase_core/firebase_core.dart';
          import 'package:firebase_auth/firebase_auth.dart';
          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'firebase_options.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await Firebase.initializeApp(options: DefaultFirebaseOptions.currentPlatform);
            runApp(const MyApp());
          }

          class MyApp extends StatelessWidget {
            const MyApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                home: StreamBuilder<User?>(
                  stream: FirebaseAuth.instance.authStateChanges(),
                  builder: (context, snapshot) {
                    if (snapshot.connectionState == ConnectionState.waiting) {
                      return const Scaffold(body: Center(child: CircularProgressIndicator()));
                    }
                    return snapshot.hasData ? const MainScreen() : const LoginScreen();
                  },
                ),
              );
            }
          }

          class LoginScreen extends StatefulWidget {
            const LoginScreen({super.key});
            @override
            State<LoginScreen> createState() => _LoginState();
          }

          class _LoginState extends State<LoginScreen> {
            final emailCtrl = TextEditingController();
            final passCtrl = TextEditingController();
            final nameCtrl = TextEditingController();
            bool isLogin = true;
            bool loading = false;

            Future<void> submit() async {
              if (emailCtrl.text.isEmpty || passCtrl.text.isEmpty) return;
              setState(() => loading = true);
              try {
                if (isLogin) {
                  await FirebaseAuth.instance.signInWithEmailAndPassword(email: emailCtrl.text.trim(), password: passCtrl.text.trim());
                } else {
                  if (nameCtrl.text.isEmpty) throw Exception("اكتب اسمك");
                  var cred = await FirebaseAuth.instance.createUserWithEmailAndPassword(email: emailCtrl.text.trim(), password: passCtrl.text.trim());
                  String base = nameCtrl.text.trim().toLowerCase().replaceAll(" ", "");
                  String code = base + "_" + DateTime.now().millisecondsSinceEpoch.toString().substring(8);
                  await FirebaseFirestore.instance.collection("users").doc(cred.user!.uid).set({
                    "uid": cred.user!.uid,
                    "name": nameCtrl.text.trim(),
                    "email": emailCtrl.text.trim(),
                    "username": code
                  });
                }
              } catch (e) {
                ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(e.toString())));
              }
              setState(() => loading = false);
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SingleChildScrollView(
                  padding: const EdgeInsets.all(20),
                  child: Column(
                    children: [
                      const SizedBox(height: 60),
                      const Text("Shlonkom - شلونكم", style: TextStyle(fontSize: 28, fontWeight: FontWeight.bold)),
                      const Text("Firebase حقيقي - شغال", style: TextStyle(color: Colors.green)),
                      const SizedBox(height: 30),
                      if (!isLogin) TextField(controller: nameCtrl, decoration: InputDecoration(labelText: "اسمك", border: OutlineInputBorder(borderRadius: BorderRadius.circular(12)))),
                      if (!isLogin) const SizedBox(height: 12),
                      TextField(controller: emailCtrl, decoration: InputDecoration(labelText: "الايميل", border: OutlineInputBorder(borderRadius: BorderRadius.circular(12)))),
                      const SizedBox(height: 12),
                      TextField(controller: passCtrl, obscureText: true, decoration: InputDecoration(labelText: "كلمة السر", border: OutlineInputBorder(borderRadius: BorderRadius.circular(12)))),
                      const SizedBox(height: 20),
                      SizedBox(width: double.infinity, child: ElevatedButton(onPressed: loading ? null : submit, style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF00C950)), child: Text(loading ? "انتظر..." : isLogin ? "دخول" : "انشاء حساب", style: const TextStyle(color: Colors.white)))),
                      TextButton(onPressed: () => setState(() => isLogin = !isLogin), child: Text(isLogin ? "ما عندك حساب؟ انشاء" : "عندك حساب؟ دخول")),
                      const SizedBox(height: 20),
                      const Text("Created by: Atheer Sami - Basra - Iraq Flag", style: TextStyle(fontSize: 11))
                    ],
                  ),
                ),
              );
            }
          }

          class MainScreen extends StatefulWidget {
            const MainScreen({super.key});
            @override
            State<MainScreen> createState() => _MainState();
          }

          class _MainState extends State<MainScreen> {
            int tab = 0;
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: tab == 0 ? const ChatsTab() : const AddTab(),
                bottomNavigationBar: BottomNavigationBar(
                  currentIndex: tab,
                  onTap: (i) => setState(() => tab = i),
                  selectedItemColor: const Color(0xFF00C950),
                  items: const [BottomNavigationBarItem(icon: Icon(Icons.chat), label: "الدردشات"), BottomNavigationBarItem(icon: Icon(Icons.person_add), label: "اضافة بالكود")],
                ),
              );
            }
          }

          class ChatsTab extends StatelessWidget {
            const ChatsTab({super.key});
            @override
            Widget build(BuildContext context) {
              var uid = FirebaseAuth.instance.currentUser!.uid;
              return Scaffold(
                appBar: AppBar(title: const Text("شلونكم"), backgroundColor: const Color(0xFF00C950), foregroundColor: Colors.white, actions: [IconButton(icon: const Icon(Icons.logout), onPressed: () => FirebaseAuth.instance.signOut())]),
                body: Column(
                  children: [
                    StreamBuilder<DocumentSnapshot>(stream: FirebaseFirestore.instance.collection("users").doc(uid).snapshots(), builder: (context, snap) {
                      if (!snap.hasData) return const SizedBox();
                      var data = snap.data!.data() as Map<String, dynamic>?;
                      if (data == null) return const SizedBox();
                      return Container(width: double.infinity, padding: const EdgeInsets.all(8), color: Colors.green.withOpacity(0.1), child: Text("كودك: @${data["username"]}", style: const TextStyle(fontWeight: FontWeight.bold)));
                    }),
                    Expanded(child: StreamBuilder<QuerySnapshot>(stream: FirebaseFirestore.instance.collection("users").doc(uid).collection("friends").snapshots(), builder: (context, s) {
                      if (!s.hasData) return const Center(child: CircularProgressIndicator());
                      if (s.data!.docs.isEmpty) return const Center(child: Text("ما عندك اصدقاء - اضف بالكود"));
                      return ListView(children: s.data!.docs.map((doc) {
                        var d = doc.data() as Map<String, dynamic>;
                        return ListTile(leading: CircleAvatar(child: Text(d["name"][0])), title: Text(d["name"]), subtitle: Text("@${d["username"]}"), onTap: () => Navigator.push(context, MaterialPageRoute(builder: (_) => ChatPage(friendId: doc.id, friendName: d["name"]))));
                      }).toList());
                    }))
                  ],
                ),
              );
            }
          }

          class AddTab extends StatefulWidget {
            const AddTab({super.key});
            @override
            State<AddTab> createState() => _AddState();
          }

          class _AddState extends State<AddTab> {
            final ctrl = TextEditingController();
            List<DocumentSnapshot> results = [];
            bool loading = false;
            Future<void> search() async {
              if (ctrl.text.trim().isEmpty) return;
              setState(() => loading = true);
              var q = await FirebaseFirestore.instance.collection("users").where("username", isEqualTo: ctrl.text.trim().replaceAll("@", "").toLowerCase()).get();
              setState(() { results = q.docs; loading = false; });
            }
            Future<void> add(DocumentSnapshot doc) async {
              var myUid = FirebaseAuth.instance.currentUser!.uid;
              var f = doc.data() as Map<String, dynamic>;
              if (f["uid"] == myUid) return;
              var myDoc = await FirebaseFirestore.instance.collection("users").doc(myUid).get();
              var myData = myDoc.data()!;
              await FirebaseFirestore.instance.collection("users").doc(myUid).collection("friends").doc(f["uid"]).set({"uid": f["uid"], "name": f["name"], "username": f["username"]});
              await FirebaseFirestore.instance.collection("users").doc(f["uid"]).collection("friends").doc(myUid).set({"uid": myUid, "name": myData["name"], "username": myData["username"]});
              ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text("تمت اضافة ${f["name"]}")));
            }
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text("اضافة بالكود"), backgroundColor: const Color(0xFF00C950), foregroundColor: Colors.white),
                body: Padding(padding: const EdgeInsets.all(16), child: Column(children: [Row(children: [Expanded(child: TextField(controller: ctrl, decoration: InputDecoration(hintText: "atheersami_123", prefixText: "@", border: OutlineInputBorder(borderRadius: BorderRadius.circular(12))))), const SizedBox(width: 8), ElevatedButton(onPressed: search, child: const Text("بحث"))]), const SizedBox(height: 20), if (loading) const CircularProgressIndicator(), ...results.map((doc) { var d = doc.data() as Map<String, dynamic>; return Card(child: ListTile(title: Text(d["name"]), subtitle: Text("@${d["username"]}"), trailing: ElevatedButton(onPressed: () => add(doc), child: const Text("اضافة")))); })])),
              );
            }
          }

          class ChatPage extends StatefulWidget {
            final String friendId, friendName;
            const ChatPage({super.key, required this.friendId, required this.friendName});
            @override
            State<ChatPage> createState() => _ChatState();
          }

          class _ChatState extends State<ChatPage> {
            final ctrl = TextEditingController();
            String get chatId { var ids = [FirebaseAuth.instance.currentUser!.uid, widget.friendId]..sort(); return ids.join("_"); }
            void send() { var t = ctrl.text.trim(); if (t.isEmpty) return; FirebaseFirestore.instance.collection("chats").doc(chatId).collection("messages").add({"text": t, "sender": FirebaseAuth.instance.currentUser!.uid, "time": FieldValue.serverTimestamp()}); ctrl.clear(); }
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text(widget.friendName), backgroundColor: const Color(0xFF00C950), foregroundColor: Colors.white),
                body: Column(children: [Expanded(child: StreamBuilder<QuerySnapshot>(stream: FirebaseFirestore.instance.collection("chats").doc(chatId).collection("messages").orderBy("time").snapshots(), builder: (context, s) { if (!s.hasData) return const Center(child: CircularProgressIndicator()); return ListView.builder(padding: const EdgeInsets.all(10), itemCount: s.data!.docs.length, itemBuilder: (context, i) { var d = s.data!.docs[i].data() as Map<String, dynamic>; bool isMe = d["sender"] == FirebaseAuth.instance.currentUser!.uid; return Align(alignment: isMe ? Alignment.centerRight : Alignment.centerLeft, child: Container(margin: const EdgeInsets.symmetric(vertical: 3), padding: const EdgeInsets.all(10), decoration: BoxDecoration(color: isMe ? const Color(0xFF00C950) : Colors.grey[200], borderRadius: BorderRadius.circular(12)), child: Text(d["text"], style: TextStyle(color: isMe ? Colors.white : Colors.black)))); }); })), Padding(padding: const EdgeInsets.all(8), child: Row(children: [Expanded(child: TextField(controller: ctrl, decoration: InputDecoration(hintText: "اكتب...", filled: true, fillColor: Colors.grey[100], border: OutlineInputBorder(borderRadius: BorderRadius.circular(20), borderSide: BorderSide.none)))), const SizedBox(width: 6), CircleAvatar(backgroundColor: const Color(0xFF00C950), child: IconButton(icon: const Icon(Icons.send, color: Colors.white), onPressed: send))]))]),
              );
            }
          }
          DART

          flutter pub get
          flutter analyze
          flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: shlonkom-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
