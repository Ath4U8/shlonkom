name: Build Shlonkom APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Fix Android & Firebase
        run: |
          if [ ! -f "android/app/google-services.json" ]; then
            echo "ERROR: google-services.json not found!"
            exit 1
          fi
          cp android/app/google-services.json /tmp/gs.json
          flutter create . --platforms=android --org dev.shlonkom --project-name shlonkom --overwrite
          cp /tmp/gs.json android/app/google-services.json
          sed -i "s/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/" android/app/build.gradle
          sed -i "s/minSdk = flutter.minSdkVersion/minSdk = 21/" android/app/build.gradle 2>/dev/null || true
          grep -q "google-services" android/build.gradle || sed -i "s/dependencies {/dependencies {\n        classpath 'com.google.gms:google-services:4.4.1'/" android/build.gradle
          grep -q "google-services" android/app/build.gradle || echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          python3 << 'PY'
          import json
          with open('android/app/google-services.json') as f:
              data=json.load(f); client=data['client'][0]; opts=client['client_info']; api=client['api_key'][0]['current_key']; proj=data['project_info']
              open('lib/firebase_options.dart','w').write(f"""import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          import 'package:flutter/foundation.dart' show defaultTargetPlatform, TargetPlatform, kIsWeb;
          class DefaultFirebaseOptions {{
            static FirebaseOptions get currentPlatform {{
              if (kIsWeb) throw UnsupportedError('web not supported');
              switch (defaultTargetPlatform) {{ case TargetPlatform.android: return android; default: throw UnsupportedError('unsupported'); }}
            }}
            static const FirebaseOptions android = FirebaseOptions(apiKey: '{api}', appId: '{opts["mobilesdk_app_id"]}', messagingSenderId: '{proj["project_number"]}', projectId: '{proj["project_id"]}', storageBucket: '{proj["storage_bucket"]}',);
          }}
          """)
          PY
      - name: Write Shlonkom App Code
        run: |
          cat > lib/main.dart << 'ENDDART'
          import 'dart:async';import 'dart:math';import 'package:flutter/material.dart';import 'package:firebase_core/firebase_core.dart';import 'package:firebase_auth/firebase_auth.dart';import 'package:cloud_firestore/cloud_firestore.dart';import 'package:flutter/services.dart';import 'firebase_options.dart';
          void main() async {WidgetsFlutterBinding.ensureInitialized();await Firebase.initializeApp(options: DefaultFirebaseOptions.currentPlatform);runApp(const MyApp());}
          class MyApp extends StatelessWidget {const MyApp({super.key});@override Widget build(BuildContext context){return const MaterialApp(debugShowCheckedModeBanner:false,home:AuthGate());}}
          class AuthGate extends StatelessWidget {const AuthGate({super.key});@override Widget build(BuildContext context){return StreamBuilder<User?>(stream:FirebaseAuth.instance.userChanges(),builder:(context,snap){if(snap.connectionState==ConnectionState.waiting) return const Scaffold(body:Center(child:CircularProgressIndicator()));if(snap.hasData){if(snap.data!.emailVerified==false) return const VerifyScreen();return const MainScreen();}return const Login();});}}
          bool isValidEmail(String e){return RegExp(r'^[\w-\.]+@([\w-]+\.)+[\w-]{2,4}$').hasMatch(e);}
          class Login extends StatefulWidget{const Login({super.key});@override State<Login> createState()=>_Login();}
          class _Login extends State<Login>{final e=TextEditingController();final p=TextEditingController();final n=TextEditingController();bool isLogin=true;bool load=false;Future<void> go() async {String email=e.text.trim();String pass=p.text.trim();String name=n.text.trim();if(email.isEmpty||pass.isEmpty){ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content:Text('املا كل الحقول')));return;}if(!isValidEmail(email)){ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content:Text('اكتب ايميل حقيقي مثل name@gmail.com')));return;}if(pass.length<6){ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content:Text('كلمة السر 6 احرف')));return;}if(!isLogin&&name.isEmpty){ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content:Text('اكتب اسمك')));return;}setState(()=>load=true);try{if(isLogin){await FirebaseAuth.instance.signInWithEmailAndPassword(email:email,password:pass);}else{var cr=await FirebaseAuth.instance.createUserWithEmailAndPassword(email:email,password:pass);var code=name.toLowerCase().replaceAll(' ','')+"_"+Random().nextInt(999999).toString().padLeft(6,'0');await FirebaseFirestore.instance.collection('users').doc(cr.user!.uid).set({'uid':cr.user!.uid,'name':name,'email':email,'username':code});await cr.user!.sendEmailVerification();}}catch(ex){ScaffoldMessenger.of(context).showSnackBar(SnackBar(content:Text(ex.toString())));}setState(()=>load=false);} @override Widget build(BuildContext context){return Scaffold(body:Padding(padding:const EdgeInsets.all(20),child:Column(children:[const SizedBox(height:60),const Text('Shlonkom - شلونكم',style:TextStyle(fontSize:26,fontWeight:FontWeight.bold)),const Text('ايميل حقيقي + مكالمات + اشعارات 🔊',style:TextStyle(color:Colors.green,fontSize:12)),const SizedBox(height:20),if(!isLogin) TextField(controller:n,decoration:InputDecoration(labelText:'اسمك',border:OutlineInputBorder(borderRadius:BorderRadius.circular(12)))),if(!isLogin) const SizedBox(height:10),TextField(controller:e,keyboardType:TextInputType.emailAddress,decoration:InputDecoration(labelText:'ايميل حقيقي',prefixIcon:const Icon(Icons.email),border:OutlineInputBorder(borderRadius:BorderRadius.circular(12)))),const SizedBox(height:10),TextField(controller:p,obscureText:true,decoration:InputDecoration(labelText:'باسوورد',border:OutlineInputBorder(borderRadius:BorderRadius.circular(12)))),const SizedBox(height:20),SizedBox(width:double.infinity,child:ElevatedButton(onPressed:load?null:go,style:ElevatedButton.styleFrom(backgroundColor:const Color(0xFF00C950)),child:Text(load?'...':isLogin?'دخول':'انشاء حساب',style:const TextStyle(color:Colors.white)))),TextButton(onPressed:()=>setState(()=>isLogin=!isLogin),child:Text(isLogin?'انشاء حساب':'دخول')),const Text('Created by: Atheer Sami - Basra 🇮🇶',style:TextStyle(fontSize:11))]))) ;}}
          class VerifyScreen extends StatefulWidget{const VerifyScreen({super.key});@override State<VerifyScreen> createState()=>_Verify();}
          class _Verify extends State<VerifyScreen>{bool loading=false;Future<void> check() async {await FirebaseAuth.instance.currentUser!.reload();}@override Widget build(BuildContext context){var email=FirebaseAuth.instance.currentUser!.email??'';return Scaffold(body:Padding(padding:const EdgeInsets.all(20),child:Column(mainAxisAlignment:MainAxisAlignment.center,children:[const Icon(Icons.email,size:80,color:Color(0xFF00C950)),const SizedBox(height:20),const Text('تحقق من ايميلك',style:TextStyle(fontSize:22,fontWeight:FontWeight.bold)),const SizedBox(height:10),Text('دزينا رابط على:\n$email',textAlign:TextAlign.center),const SizedBox(height:20),SizedBox(width:double.infinity,child:ElevatedButton(onPressed:() async {setState(()=>loading=true);await check();setState(()=>loading=false);},child:Text(loading?'...':'تحققت'))),TextButton(onPressed:()=>FirebaseAuth.instance.currentUser!.sendEmailVerification(),child:const Text('اعادة ارسال')),TextButton(onPressed:()=>FirebaseAuth.instance.signOut(),child:const Text('خروج'))])));}}
          class MainScreen extends StatefulWidget{const MainScreen({super.key});@override State<MainScreen> createState()=>_Main();}
          class _Main extends State<MainScreen>{int tab=0;@override void initState(){super.initState();listenForCalls();}void listenForCalls(){var uid=FirebaseAuth.instance.currentUser?.uid;if(uid==null) return;FirebaseFirestore.instance.collection('calls').where('calleeId',isEqualTo:uid).where('status',isEqualTo:'ringing').snapshots().listen((snap){for(var doc in snap.docs){var data=doc.data();if(mounted){HapticFeedback.vibrate();Navigator.push(context,MaterialPageRoute(builder:(_)=>IncomingScreen(callId:doc.id,callerName:data['callerName']??'مجهول',callerId:data['callerId'],isVideo:data['isVideo']??false)));}}});}@override Widget build(BuildContext context){return Scaffold(body:tab==0?const ChatsTab():const AddTab(),bottomNavigationBar:BottomNavigationBar(currentIndex:tab,onTap:(i)=>setState(()=>tab=i),selectedItemColor:const Color(0xFF00C950),items:const [BottomNavigationBarItem(icon:Icon(Icons.chat),label:'الدردشات'),BottomNavigationBarItem(icon:Icon(Icons.person_add),label:'اضافة بالكود')]));}}
          class ChatsTab extends StatelessWidget{const ChatsTab({super.key});@override Widget build(BuildContext context){var uid=FirebaseAuth.instance.currentUser!.uid;return Scaffold(appBar:AppBar(title:const Text('شلونكم 🇮🇶'),backgroundColor:const Color(0xFF00C950),foregroundColor:Colors.white,actions:[IconButton(icon:const Icon(Icons.logout),onPressed:()=>FirebaseAuth.instance.signOut())]),body:Column(children:[StreamBuilder<DocumentSnapshot>(stream:FirebaseFirestore.instance.collection('users').doc(uid).snapshots(),builder:(context,snap){if(!snap.hasData) return const SizedBox();var d=snap.data!.data() as Map<String,dynamic>?;if(d==null) return const SizedBox();return Container(width:double.infinity,padding:const EdgeInsets.all(12),color:Colors.green.withOpacity(0.1),child:Text('كودك: @${d['username']}',style:const TextStyle(fontWeight:FontWeight.bold)));}),Expanded(child:StreamBuilder<QuerySnapshot>(stream:FirebaseFirestore.instance.collection('users').doc(uid).collection('friends').snapshots(),builder:(context,s){if(!s.hasData) return const Center(child:CircularProgressIndicator());if(s.data!.docs.isEmpty) return const Center(child:Text('ما عندك اصدقاء\nضيف بالكود',textAlign:TextAlign.center));return ListView(children:s.data!.docs.map((doc){var d=doc.data() as Map<String,dynamic>;return Card(child:ListTile(leading:CircleAvatar(backgroundColor:const Color(0xFF00C950),child:Text(d['name'][0],style:const TextStyle(color:Colors.white))),title:Text(d['name']),subtitle:Text('@${d['username']}'),trailing:Row(mainAxisSize:MainAxisSize.min,children:[IconButton(icon:const Icon(Icons.call,color:Colors.green),onPressed:()=>startCall(context,doc.id,d['name'],false)),IconButton(icon:const Icon(Icons.videocam,color:Colors.blue),onPressed:()=>startCall(context,doc.id,d['name'],true)),]),onTap:()=>Navigator.push(context,MaterialPageRoute(builder:(_)=>ChatPage(friendId:doc.id,friendName:d['name'])))));}).toList());}))]));}void startCall(BuildContext context,String friendId,String friendName,bool isVideo) async {var uid=FirebaseAuth.instance.currentUser!.uid;var myDoc=await FirebaseFirestore.instance.collection('users').doc(uid).get();var myName=myDoc.data()?['name']??'مجهول';var callRef=await FirebaseFirestore.instance.collection('calls').add({'callerId':uid,'callerName':myName,'calleeId':friendId,'calleeName':friendName,'status':'ringing','isVideo':isVideo,'timestamp':FieldValue.serverTimestamp()});Navigator.push(context,MaterialPageRoute(builder:(_)=>CallScreen(callId:callRef.id,friendName:friendName,friendId:friendId,isCaller:true,isVideo:isVideo)));}
          }
          class AddTab extends StatefulWidget{const AddTab({super.key});@override State<AddTab> createState()=>_Add();}
          class _Add extends State<AddTab>{final ctrl=TextEditingController();List<DocumentSnapshot> res=[];bool load=false;Future<void> search() async {String code=ctrl.text.trim().replaceAll('@','').toLowerCase();if(code.isEmpty) return;setState(()=>load=true);var q=await FirebaseFirestore.instance.collection('users').where('username',isEqualTo:code).get();setState((){res=q.docs;load=false;});}Future<void> add(DocumentSnapshot doc) async {var myUid=FirebaseAuth.instance.currentUser!.uid;var f=doc.data() as Map<String,dynamic>;if(f['uid']==myUid) return;var myDoc=await FirebaseFirestore.instance.collection('users').doc(myUid).get();var myData=myDoc.data()!;await FirebaseFirestore.instance.collection('users').doc(myUid).collection('friends').doc(f['uid']).set({'uid':f['uid'],'name':f['name'],'username':f['username']});await FirebaseFirestore.instance.collection('users').doc(f['uid']).collection('friends').doc(myUid).set({'uid':myUid,'name':myData['name'],'username':myData['username']});ScaffoldMessenger.of(context).showSnackBar(SnackBar(content:Text('تمت اضافة ${f['name']}')));} @override Widget build(BuildContext context){return Scaffold(appBar:AppBar(title:const Text('اضافة بالكود'),backgroundColor:const Color(0xFF00C950),foregroundColor:Colors.white),body:Padding(padding:const EdgeInsets.all(16),child:Column(children:[Row(children:[Expanded(child:TextField(controller:ctrl,decoration:InputDecoration(hintText:'كود صديقك',prefixText:'@',border:OutlineInputBorder(borderRadius:BorderRadius.circular(12))))),const SizedBox(width:8),ElevatedButton(onPressed:search,child:const Text('بحث'))]),const SizedBox(height:20),if(load) const CircularProgressIndicator(),...res.map((doc){var d=doc.data() as Map<String,dynamic>;return Card(child:ListTile(title:Text(d['name']),subtitle:Text('@${d["username"]}'),trailing:ElevatedButton(onPressed:()=>add(doc),child:const Text('اضافة'))));})])));}}
          class ChatPage extends StatefulWidget{final String friendId,friendName;const ChatPage({super.key,required this.friendId,required this.friendName});@override State<ChatPage> createState()=>_Chat();}
          class _Chat extends State<ChatPage>{final ctrl=TextEditingController();final stickers=['😂','😍','🔥','💚','🇮🇶','😎','🙏','💪','❤️','☕','⚽','🌸'];String get chatId {var ids=[FirebaseAuth.instance.currentUser!.uid,widget.friendId]..sort();return ids.join('_');}void send([String? t]) async {var text=t??ctrl.text.trim();if(text.isEmpty) return;HapticFeedback.lightImpact();await FirebaseFirestore.instance.collection('chats').doc(chatId).collection('messages').add({'text':text,'sender':FirebaseAuth.instance.currentUser!.uid,'time':FieldValue.serverTimestamp()});ctrl.clear();}@override Widget build(BuildContext context){return Scaffold(appBar:AppBar(title:Text(widget.friendName),backgroundColor:const Color(0xFF00C950),foregroundColor:Colors.white,actions:[IconButton(icon:const Icon(Icons.call),onPressed:()=>ChatsTab().startCall(context,widget.friendId,widget.friendName,false)),IconButton(icon:const Icon(Icons.videocam),onPressed:()=>ChatsTab().startCall(context,widget.friendId,widget.friendName,true))]),body:Column(children:[Expanded(child:StreamBuilder<QuerySnapshot>(stream:FirebaseFirestore.instance.collection('chats').doc(chatId).collection('messages').orderBy('time').snapshots(),builder:(context,s){if(!s.hasData) return const Center(child:CircularProgressIndicator());if(s.data!.docs.isEmpty) return const Center(child:Text('ابدأ الدردشة'));return ListView.builder(padding:const EdgeInsets.all(10),itemCount:s.data!.docs.length,itemBuilder:(context,i){var d=s.data!.docs[i].data() as Map<String,dynamic>;bool isMe=d['sender']==FirebaseAuth.instance.currentUser!.uid;if(!isMe){HapticFeedback.selectionClick();}return Align(alignment:isMe?Alignment.centerRight:Alignment.centerLeft,child:Container(margin:const EdgeInsets.symmetric(vertical:3),padding:const EdgeInsets.all(10),decoration:BoxDecoration(color:isMe?const Color(0xFF00C950):Colors.grey[200],borderRadius:BorderRadius.circular(12)),child:Text(d['text'],style:TextStyle(color:isMe?Colors.white:Colors.black))));});})),Container(height:46,child:ListView.builder(scrollDirection:Axis.horizontal,itemCount:stickers.length,itemBuilder:(c,i)=>InkWell(onTap:()=>send(stickers[i]),child:Container(margin:const EdgeInsets.all(4),padding:const EdgeInsets.symmetric(horizontal:8,vertical:6),decoration:BoxDecoration(color:Colors.grey[100],borderRadius:BorderRadius.circular(12)),child:Text(stickers[i],style:const TextStyle(fontSize:20)))))),Padding(padding:const EdgeInsets.all(8),child:Row(children:[Expanded(child:TextField(controller:ctrl,decoration:InputDecoration(hintText:'اكتب...',filled:true,fillColor:Colors.grey[100],border:OutlineInputBorder(borderRadius:BorderRadius.circular(20),borderSide:BorderSide.none)))),const SizedBox(width:6),CircleAvatar(backgroundColor:const Color(0xFF00C950),child:IconButton(icon:const Icon(Icons.send,color:Colors.white),onPressed:()=>send()))]))]));}}
          class CallScreen extends StatefulWidget{final String callId,friendName,friendId;final bool isCaller,isVideo;const CallScreen({super.key,required this.callId,required this.friendName,required this.friendId,required this.isCaller,required this.isVideo});@override State<CallScreen> createState()=>_CallScreen();}
          class _CallScreen extends State<CallScreen>{bool muted=false;bool speaker=false;int seconds=0;Timer? timer;@override void initState(){super.initState();timer=Timer.periodic(const Duration(seconds:1),(t){setState(()=>seconds++);});listenForEnd();}void listenForEnd(){FirebaseFirestore.instance.collection('calls').doc(widget.callId).snapshots().listen((doc){if(!doc.exists||doc.data()?['status']=='ended'){if(mounted){timer?.cancel();Navigator.pop(context);}}});}Future<void> endCall() async {timer?.cancel();await FirebaseFirestore.instance.collection('calls').doc(widget.callId).update({'status':'ended'});if(mounted) Navigator.pop(context);}String formatTime(int s){int m=s~/60;int sec=s%60;return '${m.toString().padLeft(2,'0')}:${sec.toString().padLeft(2,'0')}';}@override void dispose(){timer?.cancel();super.dispose();}@override Widget build(BuildContext context){return Scaffold(backgroundColor:const Color(0xFF121212),body:Column(children:[const SizedBox(height:60),Text(widget.isVideo?'مكالمة فيديو':'مكالمة صوتية',style:const TextStyle(color:Colors.white70)),const SizedBox(height:20),CircleAvatar(radius:50,backgroundColor:const Color(0xFF00C950),child:Text(widget.friendName[0],style:const TextStyle(fontSize:40,color:Colors.white))),const SizedBox(height:20),Text(widget.friendName,style:const TextStyle(color:Colors.white,fontSize:24,fontWeight:FontWeight.bold)),const SizedBox(height:10),Text(formatTime(seconds),style:const TextStyle(color:Colors.white70,fontSize:18)),const Spacer(),if(widget.isVideo) Expanded(child:Container(margin:const EdgeInsets.all(20),decoration:BoxDecoration(color:Colors.grey[900],borderRadius:BorderRadius.circular(20)),child:const Center(child:Column(mainAxisAlignment:MainAxisAlignment.center,children:[Icon(Icons.videocam,size:80,color:Colors.white24),SizedBox(height:10),Text('الكاميرا ستفعل قريباً',style:TextStyle(color:Colors.white24))])))),const Spacer(),Row(mainAxisAlignment:MainAxisAlignment.spaceEvenly,children:[CircleAvatar(radius:28,backgroundColor:muted?Colors.white:Colors.white24,child:IconButton(icon:Icon(muted?Icons.mic_off:Icons.mic,color:muted?Colors.black:Colors.white),onPressed:()=>setState(()=>muted=!muted))),CircleAvatar(radius:35,backgroundColor:Colors.red,child:IconButton(icon:const Icon(Icons.call_end,color:Colors.white,size:30),onPressed:endCall)),CircleAvatar(radius:28,backgroundColor:speaker?Colors.white:Colors.white24,child:IconButton(icon:Icon(speaker?Icons.volume_up:Icons.volume_down,color:speaker?Colors.black:Colors.white),onPressed:()=>setState(()=>speaker=!speaker)))]),const SizedBox(height:40),const Text('Created by: Atheer Sami - Basra 🇮🇶',style:TextStyle(color:Colors.white38,fontSize:11)),const SizedBox(height:20)]));}}
          class IncomingScreen extends StatelessWidget{final String callId,callerName,callerId;final bool isVideo;const IncomingScreen({super.key,required this.callId,required this.callerName,required this.callerId,required this.isVideo});Future<void> accept(BuildContext context) async {await FirebaseFirestore.instance.collection('calls').doc(callId).update({'status':'accepted'});Navigator.pushReplacement(context,MaterialPageRoute(builder:(_)=>CallScreen(callId:callId,friendName:callerName,friendId:callerId,isCaller:false,isVideo:isVideo)));}Future<void> decline() async {await FirebaseFirestore.instance.collection('calls').doc(callId).update({'status':'ended'});}@override Widget build(BuildContext context){return Scaffold(backgroundColor:const Color(0xFF00C950),body:Column(children:[const SizedBox(height:100),Text(isVideo?'مكالمة فيديو واردة':'مكالمة صوتية واردة',style:const TextStyle(color:Colors.white70,fontSize:16)),const SizedBox(height:30),const CircleAvatar(radius:60,backgroundColor:Colors.white,child:Icon(Icons.person,size:60,color:Color(0xFF00C950))),const SizedBox(height:20),Text(callerName,style:const TextStyle(color:Colors.white,fontSize:28,fontWeight:FontWeight.bold)),const SizedBox(height:10),const Text('يتصل بك...',style:TextStyle(color:Colors.white70)),const Spacer(),Row(mainAxisAlignment:MainAxisAlignment.spaceEvenly,children:[Column(children:[CircleAvatar(radius:35,backgroundColor:Colors.red,child:IconButton(icon:const Icon(Icons.call_end,color:Colors.white,size:30),onPressed:() async {await decline();if(context.mounted) Navigator.pop(context);})),const SizedBox(height:8),const Text('رفض',style:TextStyle(color:Colors.white))]),Column(children:[CircleAvatar(radius:35,backgroundColor:Colors.white,child:IconButton(icon:const Icon(Icons.call,color:Color(0xFF00C950),size:30),onPressed:()=>accept(context))),const SizedBox(height:8),const Text('قبول',style:TextStyle(color:Colors.white))])]),const SizedBox(height:60)]));}
          ENDDART
      - name: Build APK
        run: flutter build apk --debug
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: shlonkom-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
