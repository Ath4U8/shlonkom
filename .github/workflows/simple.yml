name: Simple Build
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Build Shlonkom Real Firebase
        run: |
          cp android/app/google-services.json /tmp/g.json
          flutter create . --platforms=android --org dev.shlonkom --project-name shlonkom --overwrite
          mkdir -p android/app
          cp /tmp/g.json android/app/google-services.json
          
          python3 << 'PY'
          import pathlib
          # Add google-services plugin to android/build.gradle
          text=pathlib.Path('android/build.gradle').read_text()
          if 'google-services' not in text:
              text=text.replace('dependencies {', 'dependencies {\n        classpath "com.google.gms:google-services:4.4.0"')
              pathlib.Path('android/build.gradle').write_text(text)
          # Add plugin to app/build.gradle
          text=pathlib.Path('android/app/build.gradle').read_text()
          if 'google-services' not in text:
              text=text.replace("apply plugin: 'com.android.application'", "apply plugin: 'com.android.application'\napply plugin: 'com.google.gms.google-services'")
              pathlib.Path('android/app/build.gradle').write_text(text)
          print("Gradle fixed")
          PY
          
          python3 << 'PY'
          import json, pathlib
          p=pathlib.Path('android/app/google-services.json')
          j=json.loads(p.read_text())
          c=j['client'][0]
          key=c['api_key'][0]['current_key']
          app_id=c['client_info']['mobilesdk_app_id']
          proj=j['project_info']['project_id']
          num=j['project_info']['project_number']
          bucket=j['project_info']['storage_bucket']
          pathlib.Path('lib/firebase_options.dart').write_text(f"import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;\nclass DefaultFirebaseOptions {{\n static FirebaseOptions get currentPlatform => android;\n static const FirebaseOptions android = FirebaseOptions(apiKey: '{key}', appId: '{app_id}', messagingSenderId: '{num}', projectId: '{proj}', storageBucket: '{bucket}',);\n}}\n")
          pathlib.Path('pubspec.yaml').write_text("name: shlonkom\npublish_to: none\nversion: 1.0.0+1\nenvironment:\n sdk: '>=3.0.0 <4.0.0'\ndependencies:\n flutter:\n  sdk: flutter\n cupertino_icons: ^1.0.2\n firebase_core: ^2.24.0\n firebase_auth: ^4.15.0\n cloud_firestore: ^4.14.0\nflutter:\n uses-material-design: true\n")
          code="""import 'package:flutter/material.dart';
          import 'package:firebase_core/firebase_core.dart';
          import 'package:firebase_auth/firebase_auth.dart';
          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'firebase_options.dart';
          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await Firebase.initializeApp(options: DefaultFirebaseOptions.currentPlatform);
            runApp(const MyApp());
          }
          class MyApp extends StatelessWidget {
            const MyApp({super.key});
            @override
            Widget build(BuildContext context){
              return MaterialApp(debugShowCheckedModeBanner:false,home:StreamBuilder<User?>(stream:FirebaseAuth.instance.authStateChanges(),builder:(c,s){if(s.connectionState==ConnectionState.waiting) return const Scaffold(body:Center(child:CircularProgressIndicator())); return s.hasData?const MainApp():const LoginScreen();}));
            }
          }
          class IraqFlag extends StatelessWidget {
            final double w,h; const IraqFlag({super.key,this.w=40,this.h=26});
            @override
            Widget build(BuildContext context){return Container(width:w,height:h,decoration:BoxDecoration(borderRadius:BorderRadius.circular(4),border:Border.all(color:Colors.white,width:1)),child:Column(children:[Expanded(child:Container(color:const Color(0xFFCE1126))),Expanded(child:Container(color:Colors.white,child:Center(child:Text('IRAQ',style:TextStyle(color:const Color(0xFF007A3D),fontSize:h*0.28,fontWeight:FontWeight.w900))))),Expanded(child:Container(color:Colors.black))]));}
          }
          class LoginScreen extends StatefulWidget{const LoginScreen({super.key});@override State<LoginScreen> createState()=>_L;}
          class _L extends State<LoginScreen>{
            final email=TextEditingController();final pass=TextEditingController();final name=TextEditingController();bool isLogin=true;bool load=false;
            Future<void> sub() async {if(email.text.isEmpty||pass.text.isEmpty) return;setState(()=>load=true);try{if(isLogin){await FirebaseAuth.instance.signInWithEmailAndPassword(email:email.text.trim(),password:pass.text.trim());}else{if(name.text.isEmpty) throw 'اكتب اسمك';var cred=await FirebaseAuth.instance.createUserWithEmailAndPassword(email:email.text.trim(),password:pass.text.trim());String base=name.text.trim().toLowerCase().replaceAll(' ','');String cod=base+'_'+DateTime.now().millisecond.toString();await FirebaseFirestore.instance.collection('users').doc(cred.user!.uid).set({'uid':cred.user!.uid,'name':name.text.trim(),'email':email.text.trim(),'username':cod});}}catch(e){ScaffoldMessenger.of(context).showSnackBar(SnackBar(content:Text(e.toString())));}setState(()=>load=false);}
            @override Widget build(BuildContext context){return Scaffold(body:SingleChildScrollView(padding:const EdgeInsets.all(20),child:Column(children:[const SizedBox(height:40),const IraqFlag(w:70,h:44),const Text('Shlonkom - شلونكم',style:TextStyle(fontSize:26,fontWeight:FontWeight.bold)),const Text('Firebase حقيقي - API Key حقيقي',style:TextStyle(color:Colors.green,fontSize:11)),const SizedBox(height:20),if(!isLogin) TextField(controller:name,decoration:InputDecoration(labelText:'اسمك',border:OutlineInputBorder(borderRadius:BorderRadius.circular(12)))),if(!isLogin) const SizedBox(height:12),TextField(controller:email,decoration:InputDecoration(labelText:'الإيميل',border:OutlineInputBorder(borderRadius:BorderRadius.circular(12)))),const SizedBox(height:12),TextField(controller:pass,obscureText:true,decoration:InputDecoration(labelText:'كلمة السر',border:OutlineInputBorder(borderRadius:BorderRadius.circular(12)))),const SizedBox(height:16),SizedBox(width:double.infinity,child:ElevatedButton(onPressed:load?null:sub,style:ElevatedButton.styleFrom(backgroundColor:const Color(0xFF00C950)),child:Text(load?'انتظر...':isLogin?'دخول حقيقي':'إنشاء حساب + كود',style:const TextStyle(color:Colors.white)))),TextButton(onPressed:()=>setState(()=>isLogin=!isLogin),child:Text(isLogin?'ما عندك حساب؟':'عندك حساب؟')),const Row(mainAxisAlignment:MainAxisAlignment.center,children:[IraqFlag(w:30,h:20),SizedBox(width:8),Text('Created by: Atheer Sami - Basra')])])));}
          }
          class MainApp extends StatefulWidget{const MainApp({super.key});@override State<MainApp> createState()=>_M;}
          class _M extends State<MainApp>{int tab=0;@override Widget build(BuildContext context){return Scaffold(body:tab==0?const ChatsTab():const AddFriendTab(),bottomNavigationBar:BottomNavigationBar(currentIndex:tab,onTap:(i)=>setState(()=>tab=i),selectedItemColor:const Color(0xFF00C950),items:const [BottomNavigationBarItem(icon:Icon(Icons.chat),label:'الدردشات'),BottomNavigationBarItem(icon:Icon(Icons.person_add),label:'إضافة بالكود')]));}}
          class ChatsTab extends StatelessWidget{const ChatsTab({super.key});@override Widget build(BuildContext context){var uid=FirebaseAuth.instance.currentUser!.uid;return Scaffold(appBar:AppBar(title:const Text('شلونكم'),backgroundColor:const Color(0xFF00C950),foregroundColor:Colors.white,actions:[IconButton(icon:const Icon(Icons.logout),onPressed:()=>FirebaseAuth.instance.signOut())]),body:Column(children:[StreamBuilder<DocumentSnapshot>(stream:FirebaseFirestore.instance.collection('users').doc(uid).snapshots(),builder:(c,snap){if(!snap.hasData) return const SizedBox();var data=snap.data!.data() as Map<String,dynamic>?;if(data==null) return const SizedBox();return Container(width:double.infinity,padding:const EdgeInsets.all(8),color:Colors.green.withOpacity(0.1),child:Text('كودك: @${data['username']} - انسخه لصديقك',style:const TextStyle(fontWeight:FontWeight.bold,fontSize:12)));}),Expanded(child:StreamBuilder<QuerySnapshot>(stream:FirebaseFirestore.instance.collection('users').doc(uid).collection('friends').snapshots(),builder:(c,s){if(!s.hasData) return const Center(child:CircularProgressIndicator());if(s.data!.docs.isEmpty) return const Center(child:Text('ما عندك أصدقاء - أضف بالكود'));return ListView(children:s.data!.docs.map((doc){var d=doc.data() as Map<String,dynamic>;return ListTile(leading:CircleAvatar(child:Text(d['name'][0])),title:Text(d['name']),subtitle:Text('@${d['username']}'),onTap:()=>Navigator.push(c,MaterialPageRoute(builder:(_)=>ChatPage(friendId:doc.id,friendName:d['name']))));}).toList());}))]));}}
          class AddFriendTab extends StatefulWidget{const AddFriendTab({super.key});@override State<AddFriendTab> createState()=>_A;}
          class _A extends State<AddFriendTab>{final ctrl=TextEditingController();List<DocumentSnapshot> res=[];bool load=false;void search() async {if(ctrl.text.trim().isEmpty) return;setState(()=>load=true);var q=await FirebaseFirestore.instance.collection('users').where('username',isEqualTo:ctrl.text.trim().replaceAll('@','').toLowerCase()).get();setState(()=>{res=q.docs,load=false});}void add(DocumentSnapshot doc) async {var myUid=FirebaseAuth.instance.currentUser!.uid;var f=doc.data() as Map<String,dynamic>;if(f['uid']==myUid) return;var myDoc=await FirebaseFirestore.instance.collection('users').doc(myUid).get();var myData=myDoc.data()!;await FirebaseFirestore.instance.collection('users').doc(myUid).collection('friends').doc(f['uid']).set({'uid':f['uid'],'name':f['name'],'username':f['username']});await FirebaseFirestore.instance.collection('users').doc(f['uid']).collection('friends').doc(myUid).set({'uid':myUid,'name':myData['name'],'username':myData['username']});if(mounted) ScaffoldMessenger.of(context).showSnackBar(SnackBar(content:Text('تمت إضافة ${f["name"]}')));} @override Widget build(BuildContext context){return Scaffold(appBar:AppBar(title:const Text('إضافة بالكود'),backgroundColor:const Color(0xFF00C950),foregroundColor:Colors.white),body:Padding(padding:const EdgeInsets.all(16),child:Column(children:[Row(children:[Expanded(child:TextField(controller:ctrl,decoration:InputDecoration(hintText:'atheersami_123',prefixText:'@',border:OutlineInputBorder(borderRadius:BorderRadius.circular(12))))),const SizedBox(width:8),ElevatedButton(onPressed:search,child:const Text('بحث'))]),const SizedBox(height:20),if(load) const CircularProgressIndicator(),...res.map((doc){var d=doc.data() as Map<String,dynamic>;return Card(child:ListTile(leading:const IraqFlag(w:30,h:20),title:Text(d['name']),subtitle:Text('@${d["username"]}'),trailing:ElevatedButton(onPressed:()=>add(doc),child:const Text('إضافة'))));})])));}}
          class ChatPage extends StatefulWidget{final String friendId,friendName;const ChatPage({super.key,required this.friendId,required this.friendName});@override State<ChatPage> createState()=>_C;}
          class _C extends State<ChatPage>{final ctrl=TextEditingController();final stickers=['😂','😍','🔥','💚','🇮🇶','😎','🙏','💪','😘','❤️','☕','⚽','🌸'];String get chatId {var ids=[FirebaseAuth.instance.currentUser!.uid,widget.friendId]..sort();return ids.join('_');}void send([String? t]){var text=t??ctrl.text.trim();if(text.isEmpty) return;FirebaseFirestore.instance.collection('chats').doc(chatId).collection('messages').add({'text':text,'sender':FirebaseAuth.instance.currentUser!.uid,'time':FieldValue.serverTimestamp()});ctrl.clear();}@override Widget build(BuildContext context){return Scaffold(appBar:AppBar(title:Text(widget.friendName),backgroundColor:const Color(0xFF00C950),foregroundColor:Colors.white),body:Column(children:[Expanded(child:StreamBuilder<QuerySnapshot>(stream:FirebaseFirestore.instance.collection('chats').doc(chatId).collection('messages').orderBy('time').snapshots(),builder:(c,s){if(!s.hasData) return const Center(child:CircularProgressIndicator());return ListView.builder(padding:const EdgeInsets.all(10),itemCount:s.data!.docs.length,itemBuilder:(c,i){var d=s.data!.docs[i].data() as Map<String,dynamic>;bool isMe=d['sender']==FirebaseAuth.instance.currentUser!.uid;return Align(alignment:isMe?Alignment.centerRight:Alignment.centerLeft,child:Container(margin:const EdgeInsets.symmetric(vertical:3),padding:const EdgeInsets.all(10),decoration:BoxDecoration(color:isMe?const Color(0xFF00C950):Colors.grey[200],borderRadius:BorderRadius.circular(12)),child:Text(d['text'],style:TextStyle(color:isMe?Colors.white:Colors.black))));});})),Container(height:46,child:ListView.builder(scrollDirection:Axis.horizontal,itemCount:stickers.length,itemBuilder:(c,i)=>InkWell(onTap:()=>send(stickers[i]),child:Container(margin:const EdgeInsets.all(4),padding:const EdgeInsets.all(6),decoration:BoxDecoration(color:Colors.grey[100],borderRadius:BorderRadius.circular(12)),child:Text(stickers[i]))))),Padding(padding:const EdgeInsets.all(8),child:Row(children:[Expanded(child:TextField(controller:ctrl,decoration:InputDecoration(hintText:'اكتب...',filled:true,fillColor:Colors.grey[100],border:OutlineInputBorder(borderRadius:BorderRadius.circular(20),borderSide:BorderSide.none)))),const SizedBox(width:6),CircleAvatar(backgroundColor:const Color(0xFF00C950),child:IconButton(icon:const Icon(Icons.send,color:Colors.white),onPressed:()=>send()))]))]));}}
          """
          pathlib.Path('lib/main.dart').write_text(code)
          print("main.dart fixed - short lines")
          PY
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: shlonkom-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
