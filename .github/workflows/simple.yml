name: Build Shlonkom APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Fix and Build
        run: |
          cp lib/main.dart /tmp/my_main.dart
          if [ ! -f "android/app/build.gradle" ]; then
            flutter create . --platforms=android --org dev.shlonkom --project-name shlonkom --overwrite
          fi
          cp /tmp/my_main.dart lib/main.dart
          cat > pubspec.yaml << 'YAML'
          name: shlonkom
          description: Shlonkom Iraqi Chat App
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            firebase_core: ^2.24.0
            firebase_auth: ^4.20.0
            cloud_firestore: ^4.15.0
            cupertino_icons: ^1.0.2
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^2.0.0
          flutter:
            uses-material-design: true
          YAML
          sed -i "s/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/" android/app/build.gradle || true
          python3 << 'PY'
          import json
          with open('android/app/google-services.json') as f:
              d=json.load(f); c=d['client'][0]; i=c['client_info']; a=c['api_key'][0]['current_key']; p=d['project_info']
              open('lib/firebase_options.dart','w').write(f'''import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          import 'package:flutter/foundation.dart' show defaultTargetPlatform, TargetPlatform, kIsWeb;
          class DefaultFirebaseOptions {{
            static FirebaseOptions get currentPlatform {{
              if (kIsWeb) throw UnsupportedError('web');
              switch (defaultTargetPlatform) {{ case TargetPlatform.android: return android; default: throw UnsupportedError('no'); }}
            }}
            static const FirebaseOptions android = FirebaseOptions(apiKey: '{a}', appId: '{i["mobilesdk_app_id"]}', messagingSenderId: '{p["project_number"]}', projectId: '{p["project_id"]}', storageBucket: '{p["storage_bucket"]}',);
          }}
          ''')
          PY
          flutter pub get
          flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: shlonkom-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
