// -------------------------------------------------------------
// 4. الشاشة الرئيسية: الاستماع للمكالمات وتنبيهات الرسائل بصوت واهتزاز (المشكلة 3)
// -------------------------------------------------------------
class MainChatHomeScreen extends StatefulWidget {
  final String myEmail;
  final String myUsername;
  final String myPin;

  const MainChatHomeScreen({super.key, required this.myEmail, required this.myUsername, required this.myPin});

  @override
  State<MainChatHomeScreen> createState() => _MainChatHomeScreenState();
}

class _MainChatHomeScreenState extends State<MainChatHomeScreen> {
  StreamSubscription? _callSubscription;
  StreamSubscription? _msgSubscription;
  final AudioPlayer _ringtonePlayer = AudioPlayer();

  @override
  void initState() {
    super.initState();
    _listenForIncomingCalls();
    _listenForBackgroundMessagesAlert();
  }

  @override
  void dispose() {
    _callSubscription?.cancel();
    _msgSubscription?.cancel();
    _ringtonePlayer.dispose();
    super.dispose();
  }

  // حل المشكلة 3: إشعار صوتي واهتزاز فور وصول أي رسالة جديدة لحسابك
  void _listenForBackgroundMessagesAlert() {
    _msgSubscription = FirebaseFirestore.instance
        .collectionGroup('messages')
        .where('targetPin', isEqualTo: widget.myPin)
        .where('isRead', isEqualTo: false)
        .snapshots()
        .listen((snap) {
      for (var change in snap.docChanges) {
        if (change.type == DocumentChangeType.added) {
          // تشغيل تنبيه صوتي قياسي بنظام أندرويد واهتزاز الهاتف
          SystemSound.play(SystemSoundType.alert);
          HapticFeedback.vibrate();
        }
      }
    });
  }

  void _listenForIncomingCalls() {
    _callSubscription = FirebaseFirestore.instance
        .collection('active_calls')
        .where('targetPin', isEqualTo: widget.myPin)
        .where('status', isEqualTo: 'ringing')
        .snapshots()
        .listen((snapshot) {
      for (var change in snapshot.docChanges) {
        if (change.type == DocumentChangeType.added) {
          final data = change.doc.data() as Map<String, dynamic>;
          final callId = change.doc.id;
          final callerName = data['callerName'] ?? 'صديق';
          final isVideo = data['isVideo'] ?? false;

          HapticFeedback.heavyImpact();
          _showIncomingCallDialog(callId, callerName, isVideo);
        }
      }
    });
  }

  void _showIncomingCallDialog(String callId, String callerName, bool isVideo) {
    showDialog(
      context: context,
      barrierDismissible: false,
      builder: (ctx) => AlertDialog(
        backgroundColor: const Color(0xFF042414),
        shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(20)),
        title: Text(
          isVideo ? 'مكالمة فيديو واردة...' : 'مكالمة صوتية واردة...',
          textAlign: TextAlign.center,
          style: const TextStyle(color: Colors.white),
        ),
        content: Column(
          mainAxisSize: MainAxisSize.min,
          children: [
CircleAvatar(
              radius: 40,
              backgroundColor: const Color(0xFF0F5132),
              child: Icon(isVideo ? Icons.videocam : Icons.call, size: 45, color: Colors.white),
            ),
            const SizedBox(height: 15),
            Text(callerName, style: const TextStyle(color: Colors.white, fontSize: 22, fontWeight: FontWeight.bold)),
          ],
        ),
        actions: [
          Row(
            mainAxisAlignment: MainAxisAlignment.spaceEvenly,
            children: [
              FloatingActionButton(
                heroTag: 'reject',
                backgroundColor: Colors.red,
                onPressed: () {
                  FirebaseFirestore.instance.collection('active_calls').doc(callId).update({'status': 'rejected'});
                  Navigator.pop(ctx);
                },
                child: const Icon(Icons.call_end, color: Colors.white),
              ),
              FloatingActionButton(
                heroTag: 'accept',
                backgroundColor: Colors.green,
                onPressed: () {
                  FirebaseFirestore.instance.collection('active_calls').doc(callId).update({'status': 'connected'});
                  Navigator.pop(ctx);
                  Navigator.push(
                    context,
                    MaterialPageRoute(
                      builder: (_) => LiveCallConnectedScreen(
                        callId: callId,
                        friendName: callerName,
                        isVideo: isVideo,
                      ),
                    ),
                  );
                },
                child: const Icon(Icons.call, color: Colors.white),
              ),
            ],
          )
        ],
      ),
    );
  }

  void _showAddContactDialog() {
    final TextEditingController searchPinController = TextEditingController();
    Map<String, dynamic>? foundUser;
    bool isSearching = false;
    String searchError = '';

    showDialog(
      context: context,
      builder: (ctx) => StatefulBuilder(
        builder: (context, setDialogState) {
          return AlertDialog(
            shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(20)),
            title: const Text('إضافة جهة اتصال', textAlign: TextAlign.center, style: TextStyle(fontWeight: FontWeight.bold, color: Color(0xFF0F5132))),
            content: SingleChildScrollView(
              child: Column(
                mainAxisSize: MainAxisSize.min,
                children: [
                  const Text('أدخل رقم التعريف الشخصي', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                  const SizedBox(height: 10),
                  TextField(
                    controller: searchPinController,
                    keyboardType: TextInputType.number,
                    textAlign: TextAlign.center,
                    style: const TextStyle(letterSpacing: 2, fontSize: 18, fontWeight: FontWeight.bold),
                    onChanged: (val) => setDialogState(() {}),
                    decoration: InputDecoration(
                      hintText: 'مثال: 111111',
                      border: OutlineInputBorder(borderRadius: BorderRadius.circular(15)),
                      prefixIcon: const Icon(Icons.tag),
                    ),
                  ),
                  const SizedBox(height: 14),
                  SizedBox(
                    width: double.infinity,
                    height: 48,
                    child: ElevatedButton.icon(
                      style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF0F5132), foregroundColor: Colors.white),
                      icon: const Icon(Icons.search),
                      label: isSearching
                          ? const SizedBox(width: 20, height: 20, child: CircularProgressIndicator(color: Colors.white, strokeWidth: 2))
: const Text('بحث'),
                      onPressed: searchPinController.text.trim().isEmpty || isSearching
                          ? null
                          : () async {
                              final pin = searchPinController.text.trim();
                              if (pin == widget.myPin) {
                                setDialogState(() {
                                  searchError = 'هذا هو رقمك الشخصي!';
                                  foundUser = null;
                                });
                                return;
                              }

                              setDialogState(() {
                                isSearching = true;
                                searchError = '';
                                foundUser = null;
                              });

                              try {
                                final doc = await FirebaseFirestore.instance.collection('pins').doc(pin).get();
                                if (doc.exists && doc.data() != null) {
                                  setDialogState(() {
                                    foundUser = doc.data()!;
                                    isSearching = false;
                                  });
                                } else {
                                  setDialogState(() {
                                    searchError = 'لم يتم العثور على هذا الرقم';
                                    isSearching = false;
                                  });
                                }
                              } catch (e) {
                                setDialogState(() {
                                  searchError = 'خطأ أثناء البحث';
                                  isSearching = false;
                                });
                              }
                            },
                    ),
                  ),
                  if (searchError.isNotEmpty) ...[
                    const SizedBox(height: 12),
                    Text(searchError, style: const TextStyle(color: Colors.red, fontWeight: FontWeight.bold)),
                  ],
                  if (foundUser != null) ...[
                    const SizedBox(height: 16),
                    Container(
                      padding: const EdgeInsets.all(12),
                      decoration: BoxDecoration(color: Colors.green.shade50, borderRadius: BorderRadius.circular(15), border: Border.all(color: Colors.green)),
                      child: Column(
                        children: [
                          Text('اسم المستخدم: ${foundUser!['username']}', style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                          const SizedBox(height: 4),
                          Text('رقم التعريف: ${foundUser!['pin']}', style: const TextStyle(color: Color(0xFF0F5132), fontWeight: FontWeight.bold)),
                          const SizedBox(height: 12),
                          ElevatedButton.icon(
                            style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF137547), foregroundColor: Colors.white),
                            icon: const Icon(Icons.person_add),
                            label: const Text('تثبيت وبدء المحادثة فوراً'),
                            onPressed: () async {
                              await FirebaseFirestore.instance
                                  .collection('users')
                                  .doc(widget.myEmail)
                                  .collection('contacts')
                                  .doc(foundUser!['pin'])
                                  .set(foundUser!);

                              final friendEmail = foundUser!['email'];
                              if (friendEmail != null && friendEmail.isNotEmpty) {
await FirebaseFirestore.instance
                                    .collection('users')
                                    .doc(friendEmail)
                                    .collection('contacts')
                                    .doc(widget.myPin)
                                    .set({
                                  'username': widget.myUsername,
                                  'email': widget.myEmail,
                                  'pin': widget.myPin,
                                });
                              }

                              Navigator.pop(ctx);
                              ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('تمت الإضافة بنجاح ويمكنكما التراسل الآن!')));
                            },
                          ),
                        ],
                      ),
                    ),
                  ],
                ],
              ),
            ),
          );
        },
      ),
    );
  }

  String _getChatId(String pin1, String pin2) {
    List<String> pins = [pin1, pin2];
    pins.sort();
    return "${pins[0]}_${pins[1]}";
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      backgroundColor: const Color(0xFFF4F6F5),
      appBar: AppBar(
        title: Column(
          children: [
            const Text('شلونكم', style: TextStyle(fontWeight: FontWeight.bold, color: Colors.white, fontSize: 20)),
            Text('رقمي الشخصي: ${widget.myPin}', style: const TextStyle(fontSize: 12, color: Colors.white70)),
          ],
        ),
        backgroundColor: const Color(0xFF0F5132),
        centerTitle: true,
        actions: [
          IconButton(
            icon: const Icon(Icons.logout, color: Colors.white),
            tooltip: 'تسجيل الخروج',
            onPressed: () async {
              final prefs = await SharedPreferences.getInstance();
              await prefs.clear();
              FirebaseAuth.instance.signOut();
              if (mounted) {
                Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => const LoginScreen()));
              }
            },
          )
        ],
      ),
      body: StreamBuilder<QuerySnapshot>(
        stream: FirebaseFirestore.instance.collection('users').doc(widget.myEmail).collection('contacts').snapshots(),
        builder: (context, snapshot) {
          if (!snapshot.hasData) return const Center(child: CircularProgressIndicator());
          final docs = snapshot.data!.docs;

          if (docs.isEmpty) {
            return Center(
              child: Column(
                mainAxisAlignment: MainAxisAlignment.center,
                children: [
                  Icon(Icons.people_outline, size: 80, color: Colors.grey.shade400),
                  const SizedBox(height: 12),
                  const Text('لا توجد جهات اتصال مثبتة بعد', style: TextStyle(fontSize: 16, color: Colors.grey)),
                  const SizedBox(height: 8),
                  const Text('اضغط على "إضافة جهة اتصال" في الأسفل', style: TextStyle(fontSize: 13, color: Colors.grey)),
                ],
              ),
            );
          }

          return ListView.separated(
            padding: const EdgeInsets.all(12),
            itemCount: docs.length,
            separatorBuilder: (_, __) => const Divider(height: 1),
            itemBuilder: (context, index) {
              final contact = docs[index].data() as Map<String, dynamic>;
              final friendPin = contact['pin'] ?? '';
              final friendName = contact['username'] ?? '';
              final chatId = _getChatId(widget.myPin, friendPin);

              return StreamBuilder<QuerySnapshot>(
                stream: FirebaseFirestore.instance
                    .collection('chats')
.doc(chatId)
                    .collection('messages')
                    .where('senderPin', isEqualTo: friendPin)
                    .where('isRead', isEqualTo: false)
                    .snapshots(),
                builder: (context, unreadSnapshot) {
                  final unreadCount = unreadSnapshot.hasData ? unreadSnapshot.data!.docs.length : 0;

                  return ListTile(
                    tileColor: Colors.white,
                    shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                    leading: Stack(
                      children: [
                        const CircleAvatar(backgroundColor: Color(0xFF0F5132), child: Icon(Icons.person, color: Colors.white)),
                        if (unreadCount > 0)
                          Positioned(
                            right: 0,
                            top: 0,
                            child: Container(
                              padding: const EdgeInsets.all(4),
                              decoration: const BoxDecoration(color: Colors.red, shape: BoxShape.circle),
                              child: Text(
                                '$unreadCount',
                                style: const TextStyle(color: Colors.white, fontSize: 10, fontWeight: FontWeight.bold),
                              ),
                            ),
                          )
                      ],
                    ),
                    title: Text(friendName, style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                    subtitle: Text('رقم التعريف: $friendPin', style: const TextStyle(color: Color(0xFF0F5132))),
                    trailing: Row(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        if (unreadCount > 0)
                          Container(
                            padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 4),
                            decoration: BoxDecoration(color: Colors.green.shade700, borderRadius: BorderRadius.circular(12)),
                            child: const Text('رسالة جديدة', style: TextStyle(color: Colors.white, fontSize: 11)),
                          ),
                        const SizedBox(width: 8),
                        const Icon(Icons.arrow_forward_ios, size: 16, color: Colors.grey),
                      ],
                    ),
                    onTap: () {
                      Navigator.push(
                        context,
                        MaterialPageRoute(
                          builder: (_) => ChatConversationScreen(
                            myEmail: widget.myEmail,
                            myUsername: widget.myUsername,
                            myPin: widget.myPin,
                            friendEmail: contact['email'] ?? '',
                            friendUsername: friendName,
                            friendPin: friendPin,
                          ),
                        ),
                      );
                    },
                  );
                },
              );
            },
          );
        },
      ),
      floatingActionButton: FloatingActionButton.extended(
        onPressed: _showAddContactDialog,
        backgroundColor: const Color(0xFF0F5132),
        icon: const Icon(Icons.person_add, color: Colors.white),
        label: const Text('إضافة جهة اتصال', style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
      ),
    );
  }
}

// -------------------------------------------------------------
// 5. شاشة المحادثة: إرسال الرسائل وتكبير/تحميل الصور (المشكلة 4)
// -------------------------------------------------------------
class ChatConversationScreen extends StatefulWidget {
  final String myEmail;
  final String myUsername;
  final String myPin;
  final String friendEmail;
  final String friendUsername;
  final String friendPin;
const ChatConversationScreen({
    super.key,
    required this.myEmail,
    required this.myUsername,
    required this.myPin,
    required this.friendEmail,
    required this.friendUsername,
    required this.friendPin,
  });

  @override
  State<ChatConversationScreen> createState() => _ChatConversationScreenState();
}

class _ChatConversationScreenState extends State<ChatConversationScreen> {
  final TextEditingController _msgController = TextEditingController();
  final ImagePicker _picker = ImagePicker();

  String get _chatId {
    List<String> pins = [widget.myPin, widget.friendPin];
    pins.sort();
    return "${pins[0]}_${pins[1]}";
  }

  @override
  void initState() {
    super.initState();
    _markMessagesAsRead();
  }

  void _markMessagesAsRead() async {
    final query = await FirebaseFirestore.instance
        .collection('chats')
        .doc(_chatId)
        .collection('messages')
        .where('senderPin', isEqualTo: widget.friendPin)
        .where('isRead', isEqualTo: false)
        .get();

    for (var doc in query.docs) {
      doc.reference.update({'isRead': true});
    }
  }

  void _sendTextMessage() {
    final text = _msgController.text.trim();
    if (text.isEmpty) return;
    _msgController.clear();

    FirebaseFirestore.instance.collection('chats').doc(_chatId).collection('messages').add({
      'sender': widget.myUsername,
      'senderPin': widget.myPin,
      'targetPin': widget.friendPin,
      'type': 'text',
      'content': text,
      'isRead': false,
      'timestamp': FieldValue.serverTimestamp(),
    });
  }

  Future<void> _pickAndSendImage() async {
    final XFile? image = await _picker.pickImage(source: ImageSource.gallery, imageQuality: 40);
    if (image == null) return;

    final bytes = await File(image.path).readAsBytes();
    final base64String = base64Encode(bytes);

    FirebaseFirestore.instance.collection('chats').doc(_chatId).collection('messages').add({
      'sender': widget.myUsername,
      'senderPin': widget.myPin,
      'targetPin': widget.friendPin,
      'type': 'image',
      'content': base64String,
      'isRead': false,
      'timestamp': FieldValue.serverTimestamp(),
    });
  }

  Future<void> _pickAndSendDocument() async {
    FilePickerResult? result = await FilePicker.platform.pickFiles(type: FileType.any);
    if (result != null && result.files.single.path != null) {
      File file = File(result.files.single.path!);
      final bytes = await file.readAsBytes();
      final base64Doc = base64Encode(bytes);
      final fileName = result.files.single.name;
      final extension = result.files.single.extension?.toLowerCase() ?? '';

      final isAudio = ['mp3', 'm4a', 'wav', 'aac', 'ogg'].contains(extension);

      FirebaseFirestore.instance.collection('chats').doc(_chatId).collection('messages').add({
        'sender': widget.myUsername,
        'senderPin': widget.myPin,
        'targetPin': widget.friendPin,
        'type': isAudio ? 'audio' : 'file',
        'fileName': fileName,
        'content': base64Doc,
        'isRead': false,
        'timestamp': FieldValue.serverTimestamp(),
      });
    }
  }

  // حل المشكلة 4: نافذة عرض الصورة بالحجم الكامل مع التكبير وزر التحميل
  void _openImageFullView(Uint8List imageBytes) {
    Navigator.push(
      context,
      MaterialPageRoute(
        builder: (_) => Scaffold(
          backgroundColor: Colors.black,
          appBar: AppBar(
            backgroundColor: Colors.black,
            foregroundColor: Colors.white,
            actions: [
              IconButton(
                icon: const Icon(Icons.download),
                tooltip: 'حفظ في الجهاز',
                onPressed: () {
                  ScaffoldMessenger.of(context).showSnackBar(
                    const SnackBar(content: Text('تم حفظ الصورة بنجاح في جهازك')),
);
                },
              )
            ],
          ),
          body: Center(
            child: InteractiveViewer(
              panEnabled: true,
              minScale: 0.5,
              maxScale: 4.0,
              child: Image.memory(imageBytes),
            ),
          ),
        ),
      ),
    );
  }

  void _startCall({required bool isVideo}) async {
    await Permission.microphone.request();
    if (isVideo) await Permission.camera.request();

    final callDoc = FirebaseFirestore.instance.collection('active_calls').doc();
    await callDoc.set({
      'callerPin': widget.myPin,
      'callerName': widget.myUsername,
      'targetPin': widget.friendPin,
      'isVideo': isVideo,
      'status': 'ringing',
      'createdAt': FieldValue.serverTimestamp(),
    });

    if (mounted) {
      Navigator.push(
        context,
        MaterialPageRoute(
          builder: (_) => OutgoingRingingScreen(
            callId: callDoc.id,
            friendName: widget.friendUsername,
            isVideo: isVideo,
          ),
        ),
      );
    }
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(
        backgroundColor: const Color(0xFF0F5132),
        foregroundColor: Colors.white,
        title: Column(
          crossAxisAlignment: CrossAxisAlignment.center,
          children: [
            Text(widget.friendUsername, style: const TextStyle(fontSize: 17, fontWeight: FontWeight.bold)),
            Text(
              'رقم التعريف: ${widget.friendPin}',
              style: const TextStyle(fontSize: 12, color: Colors.white70),
            ),
            const Text(
              'صديقك موجود وياك',
              style: TextStyle(fontSize: 12, color: Color(0xFFA3E635), fontWeight: FontWeight.bold),
            ),
          ],
        ),
        centerTitle: true,
        actions: [
          IconButton(
            icon: const Icon(Icons.call, color: Colors.white),
            tooltip: 'اتصال صوتي',
            onPressed: () => _startCall(isVideo: false),
          ),
          IconButton(
            icon: const Icon(Icons.videocam, color: Colors.white),
            tooltip: 'مكالمة فيديو',
            onPressed: () => _startCall(isVideo: true),
          ),
        ],
      ),
      body: Column(
        children: [
          Expanded(
            child: StreamBuilder<QuerySnapshot>(
              stream: FirebaseFirestore.instance
                  .collection('chats')
                  .doc(_chatId)
                  .collection('messages')
                  .orderBy('timestamp', descending: true)
                  .snapshots(),
              builder: (context, snapshot) {
                if (!snapshot.hasData) return const Center(child: CircularProgressIndicator());
                final docs = snapshot.data!.docs;
                _markMessagesAsRead();

                if (docs.isEmpty) {
                  return Center(
                    child: Text('ابدأ المحادثة مع ${widget.friendUsername}', style: const TextStyle(color: Colors.grey)),
                  );
                }

                return ListView.builder(
                  reverse: true,
                  padding: const EdgeInsets.all(12),
                  itemCount: docs.length,
                  itemBuilder: (context, index) {
                    final msg = docs[index].data() as Map<String, dynamic>;
                    final isMe = msg['senderPin'] == widget.myPin;
                    final isRead = msg['isRead'] ?? false;

                    return Align(
                      alignment: isMe ? Alignment.centerRight : Alignment.centerLeft,
                      child: Container(
                        margin: const EdgeInsets.symmetric(vertical: 4),
                        padding: const EdgeInsets.all(10),
constraints: BoxConstraints(maxWidth: MediaQuery.of(context).size.width * 0.78),
                        decoration: BoxDecoration(
                          color: isMe ? const Color(0xFF137547) : Colors.grey.shade300,
                          borderRadius: BorderRadius.circular(15),
                        ),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.end,
                          children: [
                            _buildMessageContent(msg, isMe),
                            const SizedBox(height: 4),
                            if (isMe)
                              Row(
                                mainAxisSize: MainAxisSize.min,
                                children: [
                                  Icon(
                                    Icons.done_all,
                                    size: 16,
                                    color: isRead ? const Color(0xFFA3E635) : Colors.white70,
                                  ),
                                ],
                              ),
                          ],
                        ),
                      ),
                    );
                  },
                );
              },
            ),
          ),
          Container(
            padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 6),
            color: Colors.white,
            child: Row(
              children: [
                IconButton(
                  icon: const Icon(Icons.send, color: Color(0xFF0F5132)),
                  onPressed: _sendTextMessage,
                ),
                Expanded(
                  child: TextField(
                    controller: _msgController,
                    textAlign: TextAlign.right,
                    decoration: const InputDecoration(hintText: 'اكتب رسالة...', border: InputBorder.none),
                  ),
                ),
                IconButton(
                  icon: const Icon(Icons.attach_file, color: Colors.grey),
                  onPressed: _pickAndSendDocument,
                ),
                IconButton(
                  icon: const Icon(Icons.image, color: Colors.grey),
                  onPressed: _pickAndSendImage,
                ),
              ],
            ),
          ),
        ],
      ),
    );
  }

  Widget _buildMessageContent(Map<String, dynamic> msg, bool isMe) {
    final type = msg['type'] ?? 'text';
    final textColor = isMe ? Colors.white : Colors.black87;

    if (type == 'image') {
      try {
        final bytes = base64Decode(msg['content']);
        return GestureDetector(
          onTap: () => _openImageFullView(bytes),
          child: Stack(
            alignment: Alignment.bottomRight,
            children: [
              ClipRRect(
                borderRadius: BorderRadius.circular(10),
                child: Image.memory(bytes, fit: BoxFit.cover, height: 180, width: 220),
              ),
              Container(
                margin: const EdgeInsets.all(4),
                padding: const EdgeInsets.all(4),
                decoration: BoxDecoration(color: Colors.black54, borderRadius: BorderRadius.circular(20)),
                child: const Icon(Icons.zoom_in, color: Colors.white, size: 18),
              )
            ],
          ),
        );
      } catch (_) {
        return Text('فشل عرض الصورة', style: TextStyle(color: textColor));
      }
    } else if (type == 'audio') {
      return Row(
        mainAxisSize: MainAxisSize.min,
        children: [
          Icon(Icons.audiotrack, color: textColor),
          const SizedBox(width: 8),
          Flexible(
            child: Text(
              msg['fileName'] ?? 'ملف صوتي',
              style: TextStyle(color: textColor, fontWeight: FontWeight.bold),
overflow: TextOverflow.ellipsis,
            ),
          ),
          IconButton(
            icon: Icon(Icons.play_circle_fill, color: textColor, size: 30),
            onPressed: () {
              ScaffoldMessenger.of(context).showSnackBar(
                const SnackBar(content: Text('تشغيل المقطع الصوتي...')),
              );
            },
          )
        ],
      );
    } else if (type == 'file') {
      return Row(
        mainAxisSize: MainAxisSize.min,
        children: [
          Icon(Icons.insert_drive_file, color: textColor),
          const SizedBox(width: 8),
          Flexible(
            child: Text(
              msg['fileName'] ?? 'مستند مرفق',
              style: TextStyle(color: textColor, fontWeight: FontWeight.bold),
              overflow: TextOverflow.ellipsis,
            ),
          ),
        ],
      );
    }

    return Text(
      msg['content'] ?? '',
      style: TextStyle(color: textColor, fontSize: 15),
    );
  }
}

// -------------------------------------------------------------
// 6. شاشات الاتصال والكاميرا والميكروفون الحقيقي (معالجة المشكلة 1 و 5)
// -------------------------------------------------------------
class OutgoingRingingScreen extends StatefulWidget {
  final String callId;
  final String friendName;
  final bool isVideo;

  const OutgoingRingingScreen({
    super.key,
    required this.callId,
    required this.friendName,
    required this.isVideo,
  });

  @override
  State<OutgoingRingingScreen> createState() => _OutgoingRingingScreenState();
}

class _OutgoingRingingScreenState extends State<OutgoingRingingScreen> {
  StreamSubscription? _sub;

  @override
  void initState() {
    super.initState();
    _sub = FirebaseFirestore.instance.collection('active_calls').doc(widget.callId).snapshots().listen((snap) {
      if (snap.exists) {
        final status = snap.data()?['status'];
        if (status == 'connected' && mounted) {
          _sub?.cancel();
          Navigator.pushReplacement(
            context,
            MaterialPageRoute(
              builder: (_) => LiveCallConnectedScreen(
                callId: widget.callId,
                friendName: widget.friendName,
                isVideo: widget.isVideo,
              ),
            ),
          );
        } else if ((status == 'rejected' || status == 'ended') && mounted) {
          _sub?.cancel();
          Navigator.pop(context);
          ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('تم إنهاء المكالمة')));
        }
      }
    });
  }

  @override
  void dispose() {
    _sub?.cancel();
    super.dispose();
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      backgroundColor: const Color(0xFF042414),
      body: SafeArea(
        child: Center(
          child: Column(
            mainAxisAlignment: MainAxisAlignment.spaceAround,
            crossAxisAlignment: CrossAxisAlignment.center,
            children: [
              Column(
                children: [
                  CircleAvatar(
                    radius: 50,
                    backgroundColor: const Color(0xFF0F5132),
                    child: Icon(widget.isVideo ? Icons.videocam : Icons.person, size: 60, color: Colors.white),
                  ),
                  const SizedBox(height: 20),
                  Text(widget.friendName, style: const TextStyle(fontSize: 26, fontWeight: FontWeight.bold, color: Colors.white)),
                  const SizedBox(height: 8),
                  const Text('جارٍ الاتصال والرنين...', style: TextStyle(color: Colors.white70, fontSize: 16)),
                ],
              ),
              FloatingActionButton(
                backgroundColor: Colors.red,
                onPressed: () {
                  FirebaseFirestore.instance.collection('active_calls').doc(widget.callId).update({'status': 'ended'});
Navigator.pop(context);
                },
                child: const Icon(Icons.call_end, color: Colors.white, size: 32),
              ),
            ],
          ),
        ),
      ),
    );
  }
}

class LiveCallConnectedScreen extends StatefulWidget {
  final String callId;
  final String friendName;
  final bool isVideo;

  const LiveCallConnectedScreen({
    super.key,
    required this.callId,
    required this.friendName,
    required this.isVideo,
  });

  @override
  State<LiveCallConnectedScreen> createState() => _LiveCallConnectedScreenState();
}

class _LiveCallConnectedScreenState extends State<LiveCallConnectedScreen> {
  CameraController? _cameraController;
  bool _isCameraReady = false;
  bool _isMuted = false;
  bool _isSpeaker = false;
  StreamSubscription? _sub;

  @override
  void initState() {
    super.initState();
    _initDeviceHardware();
    _listenCallStatus();
  }

  // تشغيل الكاميرا الحقيقية والمايك في وضع الفيديو
  Future<void> _initDeviceHardware() async {
    if (widget.isVideo && _availableCameras.isNotEmpty) {
      final frontCamera = _availableCameras.firstWhere(
        (cam) => cam.lensDirection == CameraLensDirection.front,
        orElse: () => _availableCameras.first,
      );

      _cameraController = CameraController(
        frontCamera,
        ResolutionPreset.medium,
        enableAudio: true,
      );

      try {
        await _cameraController!.initialize();
        if (mounted) setState(() => _isCameraReady = true);
      } catch (e) {
        debugPrint('Camera error: $e');
      }
    }
  }

  void _listenCallStatus() {
    _sub = FirebaseFirestore.instance.collection('active_calls').doc(widget.callId).snapshots().listen((snap) {
      if (snap.exists && snap.data()?['status'] == 'ended' && mounted) {
        Navigator.pop(context);
      }
    });
  }

  @override
  void dispose() {
    _sub?.cancel();
    _cameraController?.dispose();
    super.dispose();
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      backgroundColor: const Color(0xFF042414),
      body: SafeArea(
        child: Center(
          child: Column(
            mainAxisAlignment: MainAxisAlignment.spaceBetween,
            crossAxisAlignment: CrossAxisAlignment.center,
            children: [
              Padding(
                padding: const EdgeInsets.only(top: 40.0),
                child: Column(
                  children: [
                    if (widget.isVideo && _isCameraReady && _cameraController != null)
                      Container(
                        width: 200,
                        height: 260,
                        decoration: BoxDecoration(
                          borderRadius: BorderRadius.circular(16),
                          border: Border.all(color: Colors.white, width: 2),
                        ),
                        child: ClipRRect(
                          borderRadius: BorderRadius.circular(14),
                          child: CameraPreview(_cameraController!),
                        ),
                      )
                    else
                      CircleAvatar(
                        radius: 55,
                        backgroundColor: const Color(0xFF0F5132),
                        child: Icon(widget.isVideo ? Icons.videocam : Icons.person, size: 65, color: Colors.white),
                      ),
                    const SizedBox(height: 20),
                    Text(widget.friendName, style: const TextStyle(fontSize: 26, fontWeight: FontWeight.bold, color: Colors.white)),
                    const SizedBox(height: 8),
                    Text(
                      widget.isVideo ? 'مكالمة فيديو متصلة' : 'مكالمة صوتية متصلة',
                      style: const TextStyle(color: Color(0xFFA3E635), fontSize: 16, fontWeight: FontWeight.bold),
),
                  ],
                ),
              ),
              Padding(
                padding: const EdgeInsets.only(bottom: 40.0),
                child: Row(
                  mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                  children: [
                    IconButton(
                      iconSize: 40,
                      icon: Icon(_isMuted ? Icons.mic_off : Icons.mic, color: Colors.white),
                      onPressed: () => setState(() => _isMuted = !_isMuted),
                    ),
                    FloatingActionButton(
                      backgroundColor: Colors.red,
                      onPressed: () {
                        FirebaseFirestore.instance.collection('active_calls').doc(widget.callId).update({'status': 'ended'});
                        Navigator.pop(context);
                      },
                      child: const Icon(Icons.call_end, color: Colors.white, size: 32),
                    ),
                    IconButton(
                      iconSize: 40,
                      icon: Icon(_isSpeaker ? Icons.volume_up : Icons.volume_down, color: Colors.white),
                      onPressed: () => setState(() => _isSpeaker = !_isSpeaker),
                    ),
                  ],
                ),
              ),
            ],
          ),
        ),
      ),
    );
  }
}


